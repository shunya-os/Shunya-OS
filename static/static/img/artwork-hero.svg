<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 425" fill="none" style="position:absolute;inset:0;width:100%;height:100%">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#faf8f5" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f5f2ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f3efe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d4c0a8" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#a4865f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#a4865f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="toplight" cx="50%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#d4bc94" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#c4a87a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a4865f" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="silk2" x1="1" y1="0.2" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#d4b888" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#c4a470" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a4865f" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a4865f" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#c4a87a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a4865f" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="blur-silk"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blur-glow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur-bloom"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="736" height="425" fill="#f8f6f2" rx="20"/>
  <g id="light-system">
    <rect width="736" height="425" fill="url(#ambient)"/>
    <rect width="736" height="425" fill="url(#warmth)"/>
    <rect width="736" height="425" fill="url(#toplight)"/>
    <rect width="736" height="425" fill="url(#vignette)"/>
  </g>
  <ellipse cx="368" cy="212" rx="140" ry="90" fill="#f5efe6" opacity="0.12" filter="url(#blur-bloom)"/>
  <ellipse cx="368" cy="212" rx="60" ry="40" fill="#a4865f" opacity="0.025" filter="url(#blur-glow)"/>
  <g id="halo-system">
    <path d="M 368 30 A 190 190 0 0 1 540 140 A 190 190 0 0 1 550 240" fill="none" stroke="url(#halo)" stroke-width="0.5" opacity="0.12" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 368 212" to="360 368 212" dur="80s" repeatCount="indefinite"/>
    </path>
    <path d="M 210 190 A 150 150 0 0 1 530 190" fill="none" stroke="#a4865f" stroke-width="0.35" opacity="0.06" stroke-dasharray="5 15" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360 368 212" to="0 368 212" dur="60s" repeatCount="indefinite"/>
    </path>
    <path d="M 260 160 A 100 100 0 0 1 470 160" fill="none" stroke="#d4c0a8" stroke-width="0.25" opacity="0.04" stroke-dasharray="3 12" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 368 212" to="360 368 212" dur="45s" repeatCount="indefinite"/>
    </path>
  </g>
  <g id="ribbon-system">
    <path d="M 30 360 C 100 280, 180 170, 300 150 C 400 132, 480 160, 540 220" stroke="url(#silk)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.2" filter="url(#blur-silk)">
      <animate attributeName="d" values="M 30 360 C 100 280, 180 170, 300 150 C 400 132, 480 160, 540 220;M 30 360 C 105 275, 185 165, 300 145 C 405 125, 485 155, 540 220;M 30 360 C 100 280, 180 170, 300 150 C 400 132, 480 160, 540 220" dur="20s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </path>
    <path d="M 50 335 C 120 265, 190 160, 310 140 C 410 120, 470 145, 520 200" stroke="url(#silk)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.25">
      <animate attributeName="d" values="M 50 335 C 120 265, 190 160, 310 140 C 410 120, 470 145, 520 200;M 50 335 C 125 260, 195 155, 310 135 C 415 114, 475 140, 520 200;M 50 335 C 120 265, 190 160, 310 140 C 410 120, 470 145, 520 200" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </path>
    <path d="M 40 310 C 100 250, 170 200, 280 180 C 380 160, 450 175, 500 230" stroke="url(#silk2)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.15">
      <animate attributeName="d" values="M 40 310 C 100 250, 170 200, 280 180 C 380 160, 450 175, 500 230;M 40 310 C 105 245, 175 195, 280 175 C 385 152, 455 170, 500 230;M 40 310 C 100 250, 170 200, 280 180 C 380 160, 450 175, 500 230" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </path>
  </g>
  <g id="shunya-identity">
    <text x="368" y="210" text-anchor="middle" dominant-baseline="central"
          font-family="'Noto Sans Devanagari','Nirmala UI','Sanskrit Text','Mukta',serif"
          font-size="36" font-weight="500" fill="#1a1c1d" opacity="0.78" letter-spacing="0.06em">
      शून्य
      <animate attributeName="opacity" values="0.76;0.82;0.76" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  <g id="infinite-tagline">
    <text x="368" y="248" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="9" font-weight="400" fill="#1a1c1d" opacity="0.32" letter-spacing="0.25em">
      INFINITE INTELLIGENCE.
    </text>
    <text x="368" y="262" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-size="9" font-weight="400" fill="#1a1c1d" opacity="0.25" letter-spacing="0.25em">
      ZERO NOISE.
    </text>
  </g>
</svg>
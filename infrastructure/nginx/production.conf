# SHUNYA Production Reverse Proxy — nginx Configuration
# =============================================================================
# Canonical application surface: app.shunyaos.com
# Public site: shunyaos.com (separate, no application logic)
#
# Requirements satisfied:
#   HTTPS redirect
#   WebSocket support
#   gzip compression
#   Cache headers for static assets
#   Security headers (CSP, HSTS, XSS, etc.)
#   Upload limits (16 MB)
#   Request limits
#   Proxy buffering
# =============================================================================

upstream shunya_app {
    server web:8000;
    keepalive 32;
}

# ---- HTTP → HTTPS redirect ----
server {
    listen 80;
    server_name app.shunyaos.com shunyaos.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS server ----
server {
    listen 443 ssl http2;
    server_name app.shunyaos.com;

    # ------------------------------------------------------------------
    # SSL / TLS
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/app.shunyaos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.shunyaos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!DSS:!RC4:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ------------------------------------------------------------------
    # Limits
    # ------------------------------------------------------------------
    client_max_body_size        16M;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    keepalive_timeout           65;

    # ------------------------------------------------------------------
    # Gzip
    # ------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    access_log  /var/log/nginx/shunya-access.log json;
    error_log   /var/log/nginx/shunya-error.log warn;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    # ------------------------------------------------------------------
    # Static Assets — immutable delivery
    # ------------------------------------------------------------------
    location /static/ {
        alias /app/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Health endpoints — no caching, no auth
    # ------------------------------------------------------------------
    location /health {
        proxy_pass http://shunya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        access_log off;
    }

    location /ready {
        proxy_pass http://shunya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        access_log off;
    }

    location /live {
        proxy_pass http://shunya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Application Proxy
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://shunya_app;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering
        proxy_buffering        on;
        proxy_buffer_size      4k;
        proxy_buffers          8 4k;
        proxy_busy_buffers_size 8k;

        # Timeouts
        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      120s;

        # Cookie paths
        proxy_cookie_path / "/; secure; HttpOnly; SameSite=Lax";
    }
}

# ---- Public site (separate, no application logic) ----
server {
    listen 443 ssl http2;
    server_name shunyaos.com;

    ssl_certificate     /etc/letsencrypt/live/shunyaos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shunyaos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /app/public_site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    access_log  /var/log/nginx/shunyaos-access.log json;
    error_log   /var/log/nginx/shunyaos-error.log warn;
}
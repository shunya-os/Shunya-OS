# SHUNYA — nginx Configuration
# =============================================================================
# Production configuration lives in infrastructure/nginx/production.conf
# Development configuration lives in infrastructure/nginx/development.conf
# This file provides a minimal local-dev fallback.
# =============================================================================

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/ai.shunyaos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.shunyaos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 16M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        alias /app/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /health { proxy_pass http://web:8000; access_log off; }
    location /ready  { proxy_pass http://web:8000; access_log off; }
    location /live   { proxy_pass http://web:8000; access_log off; }
}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUNYA — Verify your identity</title>
  <meta name="description" content="Verify your identity to continue">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23a4865f'/></svg>">
  <style>
    /* ─── Code Input ─── */
    .code-inputs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .code-inputs input {
      width: 52px;
      height: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      font-family: 'Inter', sans-serif;
      background: var(--shunya-surface);
      border: 1px solid var(--shunya-border);
      border-radius: var(--shunya-radius-sm);
      color: var(--shunya-text);
      outline: none;
      transition: border-color var(--shunya-duration-fast) var(--shunya-ease);
    }
    .code-inputs input:focus { border-color: rgba(26,28,29,0.2); }
    .code-inputs input.filled { border-color: rgba(26,28,29,0.14); }

    /* ─── Email Display ─── */
    .email-display {
      text-align: center;
      font-size: 14px;
      color: var(--shunya-text);
      margin-bottom: 24px;
      padding: 8px 16px;
      background: var(--shunya-surface);
      border: 1px solid var(--shunya-border);
      border-radius: var(--shunya-radius-sm);
    }

    /* ─── Resend Link ─── */
    .auth-resend {
      text-align: center;
      font-size: 12px;
      color: var(--shunya-text-tertiary);
      margin-top: 24px;
    }
    .auth-resend a {
      color: var(--shunya-text);
      text-decoration: none;
      border-bottom: 1px solid var(--shunya-border);
      padding-bottom: 1px;
      transition: border-color var(--shunya-duration-fast) var(--shunya-ease);
    }
    .auth-resend a:hover { border-color: var(--shunya-text); }
  </style>
</head>
<body>
  <div class="auth-strip">
    <div class="auth-strip-left">
      <span class="auth-strip-dot" aria-hidden="true"></span>
      <span class="auth-strip-logo">SHUNYA</span>
    </div>
    <div class="auth-strip-nav">
      <a href="/">Home</a>
    </div>
  </div>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Check your email</h1>
      <p class="sub">We sent a verification code to your email address. Enter it below to continue.</p>

      <div class="email-display">{{ email|default('you@example.com') }}</div>

      <form method="post" action="{{ action|default('/login') }}" id="verify-form">
        <div class="code-inputs" id="code-inputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <input type="hidden" name="code" id="code-hidden">
        <button type="submit" class="auth-btn" id="verify-btn" disabled>Verify</button>
      </form>

      <div class="auth-resend">
        Didn't receive it? <a href="#">Send again</a>
      </div>
    </div>
  </main>

  <script>
    var inputs = document.querySelectorAll('#code-inputs input');
    var hidden = document.getElementById('code-hidden');
    var btn = document.getElementById('verify-btn');

    inputs.forEach(function(input, index) {
      input.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        updateCode();
      });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      input.addEventListener('focus', function() {
        this.select();
      });
    });

    function updateCode() {
      var code = '';
      inputs.forEach(function(input) { code += input.value; });
      hidden.value = code;
      btn.disabled = code.length !== inputs.length;
    }
  </script>
</body>
</html>

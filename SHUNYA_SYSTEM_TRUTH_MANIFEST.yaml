# DECISIONS — Canonical Ownership Lock
# ============================================
decisions:
  - concept: object_system
    canonical: "objects (app/models.py)"
    deprecated: ["canonical_objects", "sh_uop_objects"]
    transitional: ["founder_objects", "sh_objects"]
    note: "founder_objects still needed by Executive Home until migration"
    migration: "Create migration to redirect founder_object reads to objects"

  - concept: identity_system
    canonical_auth: "team_members"
    canonical_kernel: "shunya_identities"
    canonical_business: "persons (empty — needs seeding)"
    deprecated: []
    note: "Three valid purposes — not competing"

  - concept: invoice_system
    canonical: "fin_invoices"
    deprecated: ["invoices (app/models.py)"]
    action: "Keep fin_* as canonical. Drop legacy invoices table."

  - concept: relationship_system
    canonical: "relationships (app/models.py)"
    deprecated: ["rel_relationships"]
    transitional: ["object_relations"]
    action: "Deprecate rel_relationships. Keep relationships as single canonical store."

  - concept: memory_system
    canonical: "memory_records"
    deprecated: []
    action: "Single canonical memory store. All memory writes go here."


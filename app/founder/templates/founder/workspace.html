<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUNYA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/workspace.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
</head>
<body>

<div id="workspace">

  <!-- ── Identity Strip ── -->
  <div id="identity-strip">
    <div class="strip-left">
      <span class="strip-logo" id="strip-identity">SHUNYA</span>
      <span class="strip-logo-dot"></span>
      <div class="strip-breadcrumb">
        <span onclick="navClick('morning')">Workspace</span>
      </div>
    </div>
    <div class="strip-right">
      <div class="strip-attention" onclick="navClick('executive')">
        <span class="strip-attention-dot none"></span>
        <span>Executive Brief</span>
      </div>
      <span class="strip-time" id="time-indicator"></span>
    </div>
  </div>

  <!-- ── Three Zones ── -->
  <div id="zones">

    <!-- Left Zone: Navigation -->
    <div id="zone-left">
      <div class="zone-left-header">Navigate</div>
      <div class="zone-left-search">
        <input type="text" placeholder="Search..." onclick="openSearch()" readonly>
      </div>
      <div class="zone-left-nav">
        <div class="nav-section">Workspace</div>
        <button class="nav-item active" id="nav-morning" onclick="navClick('morning')">
          <span class="nav-icon">&#127775;</span>
          Morning Zero
        </button>
        <button class="nav-item" id="nav-executive" onclick="navClick('executive')">
          <span class="nav-icon">&#128202;</span>
          Executive Brief
        </button>

        <div class="nav-section">Objects</div>
        <button class="nav-item" onclick="loadMorningZero()">
          <span class="nav-icon">&#128196;</span>
          All Objects
        </button>

        <div class="nav-section">System</div>
        <button class="nav-item" onclick="fetch('/founder/logout').then(()=>window.location.reload())">
          <span class="nav-icon">&#128682;</span>
          Log out
        </button>
      </div>
    </div>

    <!-- Center Zone: Object Workspace -->
    <div id="zone-center">
      <div class="empty-state">
        <div class="empty-icon">&#127775;</div>
        <h2>Loading SHUNYA...</h2>
        <p>Your workspace is being prepared.</p>
      </div>
    </div>

    <!-- Right Zone: SHUNYA Intelligence -->
    <div id="zone-right">
      <div class="zone-right-header">SHUNYA Intelligence</div>
      <div class="zone-right-body" id="zone-right-body">
        <div class="intel-section">
          <div class="intel-section-title">Health</div>
          <div class="skeleton skeleton-line" style="width:60%"></div>
        </div>
        <div class="intel-section">
          <div class="intel-section-title">Priorities</div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
        <div class="intel-section">
          <div class="intel-section-title">Risks</div>
          <div class="skeleton skeleton-line"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ── Search Overlay ── -->
<div id="search-overlay">
  <div class="search-inner">
    <input type="text" id="search-input" placeholder="Search SHUNYA..." autocomplete="off" spellcheck="false">
    <div class="search-hint">Type to search objects, conversations, and insights</div>
    <div id="search-results"></div>
  </div>
</div>

<!-- ── Status Dot ── -->
<div id="status-dot" class="calm"></div>

<script src="/static/js/workspace.js"></script>

</body>
</html>

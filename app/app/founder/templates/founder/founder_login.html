<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — SHUNYA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf8; --surface: #ffffff; --text: #191b1c;
      --text-secondary: rgba(25,27,28,0.55); --text-tertiary: rgba(25,27,28,0.35);
      --text-faint: rgba(25,27,28,0.15); --border: rgba(25,27,28,0.07);
      --accent-warm: #aa8964; --radius-sm: 10px;
      --transition: 400ms cubic-bezier(0.22,1,0.36,1);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .strip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 52px;
      border-bottom: 1px solid var(--border); background: #faf9f8;
    }
    .strip-left { display: flex; align-items: center; gap: 8px; }
    .strip-logo { font-size: 13px; font-weight: 500; color: var(--text); }
    .strip-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-warm); }
    .strip-nav a { font-size: 12px; color: var(--text-tertiary); text-decoration: none; transition: color 200ms; }
    .strip-nav a:hover { color: var(--text); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .card { width: 100%; max-width: 400px; }
    .back { font-size: 12px; color: var(--text-tertiary); text-decoration: none; margin-bottom: 24px; display: inline-block; transition: color 200ms; }
    .back:hover { color: var(--text); }
    h1 { font-size: 22px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; font-family: var(--font); color: var(--text);
      outline: none; transition: border-color 200ms;
    }
    input:focus { border-color: rgba(25,27,28,0.2); }
    input::placeholder { color: var(--text-faint); }
    .field { margin-bottom: 18px; }
    .error { font-size: 12px; color: #c0392b; display: none; margin-bottom: 14px; }
    .btn {
      width: 100%; padding: 10px; background: var(--text); color: var(--surface);
      border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
      font-family: var(--font); cursor: pointer; transition: opacity 200ms;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .footnote { font-size: 11px; color: var(--text-faint); text-align: center; margin-top: 20px; }
    @media (max-width: 768px) { .strip { padding: 0 16px; } }
  </style>
</head>
<body>
  <div class="strip">
    <div class="strip-left">
      <span class="strip-dot"></span>
      <span class="strip-logo">SHUNYA</span>
    </div>
    <div class="strip-nav"><a href="/">Back</a></div>
  </div>
  <main>
    <div class="card">
      <a href="/" class="back">&larr; Back</a>
      <h1>Welcome to SHUNYA</h1>
      <p class="sub">Sign in or create your identity to continue.</p>
      <form id="signin-form">
        <div class="field">
          <label>Name</label>
          <input type="text" id="name" autofocus placeholder="Your name (for new identities)">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="error" id="error-msg"></div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p class="footnote">First time? Just enter your details — we'll create your identity.</p>
    </div>
  </main>
  <script>
    document.getElementById('signin-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button'); const err = document.getElementById('error-msg');
      btn.disabled = true; btn.textContent = 'Signing in...'; err.style.display = 'none';
      try {
        const resp = await fetch('/api/v1/founder/signin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim().toLowerCase(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await resp.json();
        if (data.success) { window.location.href = data.redirect || '/workspace'; }
        else { err.textContent = data.error || 'Something went wrong.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign In'; }
      } catch(e) { err.textContent = 'Could not connect. Please try again.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign In'; }
    });
  </script>
</body>
</html>

  awareness:
    description: "Awareness signals and context scanning"
    canonical_owner: "app/intelligence/awareness.py"
    canonical_function: "scan()"
    production_backend: "In-memory / SQLAlchemy"
    status: "production"

  execution_runtime_adapter:
    description: "Compatibility stub for archived execution_runtime"
    canonical_owner: "app/execution_runtime/__init__.py"
    canonical_function: "compatibility stub — loads from _archive/"
    production_backend: "Archive loader"
    status: "transitional — to be removed when dependents migrate"

# ══════════════════════════════════════════════════════════════════════════════
# ARCHIVED MODULES — must not be imported accidentally into production
# ══════════════════════════════════════════════════════════════════════════════

archived_modules:
  - path: "app/execution_runtime/"
    reason: "Routes and runtime deleted. Only compatibility stub __init__.py remains."
    deleted_files: ["routes.py", "runtime.py"]
    still_imported_by:
      - "app/travel_intelligence/travel.py"  # lazy import inside try/except — will fail silently
    disposition: "FIXED — production imports removed during FDA1 correction"
  - path: "app/object_composer/"
    reason: "Entire module deleted (composer.py, routes.py removed). Directory no longer exists."
    deleted_files: ["composer.py", "routes.py"]
    still_imported_by:
      - "app/travel_intelligence/travel.py"  # lazy import inside try/except — will fail silently
    disposition: "FIXED — production imports removed during FDA1 correction"
  - path: "app/object_workspace/"
    reason: "Entire module deleted (workspace.py, routes.py removed). Directory no longer exists."
    deleted_files: ["workspace.py", "routes.py"]
    still_imported_by: []
    disposition: "CLEAN — no remaining imports"

# ══════════════════════════════════════════════════════════════════════════════
# DUPLICATE PATHS — production duplicates that must be resolved
# ══════════════════════════════════════════════════════════════════════════════

critical_duplicates:
  - concept: "Gmail ingestion"
    primary: "app/integration/gmail_ingest.py"
    duplicate: "backend/integrations/google/gmail_client.py"
    risk: "MEDIUM — two entry points for Gmail data"
    resolution: "Consolidate extraction into app/integration in future FDA"
    status: "FDA1 CORRECTION: observe_email() call removed from gmail_client.py __main__"
  - concept: "Identity resolution"
    primary: "app/core/identity/resolver.py"
    duplicate: "backend/bridge/email_observation_bridge.py"
    risk: "HIGH — bridge creates independent identity store"
    resolution: "REMOVED during FDA1 correction"
    status: "RESOLVED"
  - concept: "Event bus"
    primary: "core/event/engine.py"
    duplicate: "backend/bridge/email_observation_bridge.py"
    risk: "MEDIUM — bridge creates private EventEngine instance"
    resolution: "REMOVED during FDA1 correction"
    status: "RESOLVED"
  - concept: "Email memory store"
    primary: "app/intelligence/memory_store.py"
    duplicate: "backend/core/email/email_store.py"
    risk: "LOW — JSON file store used as development cache, not production memory"
    resolution: "RETAIN as development-only adapter; document as non-production"
    status: "RETAINED with documentation"

# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION DATA FLOW
# ══════════════════════════════════════════════════════════════════════════════

data_flow:
  ingestion:
    - source: "Gmail API / WhatsApp / Webhook"
    - step: "app/integration/gmail_ingest.py → fetch_emails()"
    - step: "app/core/identity/resolver.py → resolve_identity()"
    - step: "app/evidence/models_db.py → create_evidence()"
    - step: "app/runtime/entry.py → process_event()"

  decision_pipeline:
    - step: "app/runtime/entry.py → _capture_evidence()"
    - step: "app/runtime/entry.py → build_context()"
    - step: "app/runtime/entry.py → _build_awareness() → app/intelligence/awareness.py → scan()"
    - step: "app/runtime/entry.py → _make_decision() → app/intelligence/decision_engine.py → compute_decisions()"

  execution:
    - step: "app/runtime/entry.py → _execute_with_trace()"
    - step: "app/core/shadow_runner.py → run_all_shadows()"
    - step: "app/intelligence/comparator.py → compare()"
    - step: "app/evidence/decision_trace.py → record_decision_trace()"
    - step: "app/execution_engine/engine.py → open_execution_gate()"
    - step: "app/runtime/loop.py → run_cycle()"
    - step: "app/intelligence/learning.py → record_outcome()"

  memory:
    - step: "app/intelligence/memory_store.py → MemoryStore"
    - step: "app/intelligence/observation.py → ObservationStore"

# ══════════════════════════════════════════════════════════════════════════════
# RULES FOR ADDING FUTURE MODULES
# ══════════════════════════════════════════════════════════════════════════════

module_addition_rules:
  - rule: "Every new module must declare its canonical concept in architecture/CANONICAL_ARCHITECTURE.yaml"
  - rule: "No new module may create a second production path for an existing canonical concept"
  - rule: "New modules must be registrable via a single canonical registry or import path"
  - rule: "New modules must not create independent identity, event, memory, or execution systems"
  - rule: "New modules should prefer composition over inheritance of existing canonical systems"
  - rule: "New modules must include tests proving they do not bypass the canonical execution gate (app/runtime/entry.py)"
  - rule: "New modules must be reviewed against this architecture document before merging"
  - rule: "Archived modules must be explicitly listed in archived_modules and cannot be imported by any production module"
  - rule: "The regression test suite (tests/test_fda1_canonical_architecture.py) must pass in CI before any merge"
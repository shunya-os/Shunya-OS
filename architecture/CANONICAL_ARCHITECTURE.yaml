# SHUNYA OS — Canonical Architecture & Ownership Lock
# FDA1 — Canonical Architecture & Ownership Lock
# Machine-checkable architecture inventory.
# Every concept maps to exactly one canonical production owner.
# Duplicate/legacy/archived paths are explicitly identified.

metadata:
  document: "SHUNYA_OS_FDA1_CANONICAL_ARCHITECTURE"
  version: 1.1
  date: "2026-08-10"
  governing_directive: "FDA1 CORRECTION"
  status: "production"

# ══════════════════════════════════════════════════════════════════════════════
# CANONICAL CONCEPT OWNERSHIP
# ══════════════════════════════════════════════════════════════════════════════
# Each core concept maps to exactly one canonical production owner.
# The canonical_owner is the authoritative file/module for the concept.
# All other references are duplicates, adapters, or legacy.

canonical_ownership:

  identity:
    description: "Identity resolution and lifecycle management"
    canonical_owner: "app/core/identity/resolver.py"
    canonical_function: "resolve_identity()"
    production_backend: "SQLAlchemy (Object model)"
    status: "production"

  tenant:
    description: "Multi-tenant isolation and organization boundaries"
    canonical_owner: "app/tenant.py"
    canonical_function: "tenant context"
    production_backend: "Flask request context / SQLAlchemy"
    status: "production"

  objects:
    description: "Core domain Object model — the universal entity"
    canonical_owner: "app/objects/models.py"
    canonical_function: "Object class"
    production_backend: "SQLAlchemy"
    status: "production"

  events:
    description: "Canonical event bus and event types"
    canonical_owner: "core/event/engine.py"
    canonical_function: "EventEngine"
    production_backend: "In-memory (no persistence)"
    status: "production"

  observations:
    description: "Observation lifecycle and store"
    canonical_owner: "app/intelligence/observation.py"
    canonical_function: "Observation, ObservationStore"
    production_backend: "In-memory"
    status: "production"

  evidence:
    description: "Evidence records for provenance and audit"
    canonical_owner: "app/evidence/models_db.py"
    canonical_function: "create_evidence()"
    production_backend: "SQLAlchemy"
    status: "production"

  memory:
    description: "Episodic and semantic memory store"
    canonical_owner: "app/intelligence/memory_store.py"
    canonical_function: "MemoryStore"
    production_backend: "In-memory / SQLAlchemy"
    status: "production"

  commitments:
    description: "Commitment lifecycle management"
    canonical_owner: "app/commitments/models.py"
    canonical_function: "Commitment model"
    production_backend: "SQLAlchemy"
    status: "production"

  business_execution_instance:
    description: "Durable execution aggregate tracking a business process"
    canonical_owner: "app/execution/models.py"
    canonical_function: "Execution model"
    production_backend: "SQLAlchemy"
    status: "production"

  tasks:
    description: "Individual task execution tracking"
    canonical_owner: "app/execution/runtime.py"
    canonical_function: "Execution runtime"
    production_backend: "SQLAlchemy"
    status: "production"

  plans:
    description: "Planning and objective tracking"
    canonical_owner: "app/planning/plan.py"
    canonical_function: "Plan model"
    production_backend: "SQLAlchemy"
    status: "production"

  decisions:
    description: "Decision computation and lifecycle"
    canonical_owner: "app/intelligence/decision_engine.py"
    canonical_function: "compute_decisions()"
    production_backend: "In-memory / SQLAlchemy"
    status: "production"

  decision_runtime:
    description: "Decision object model, stores, and middleware"
    canonical_owner: "app/decision_runtime/"
    canonical_function: "Decision, DecisionStatus, get_store, get_commitment_service"
    production_backend: "In-memory stores"
    status: "production"

  learning_intelligence:
    description: "Advanced learning intelligence engine with pattern recognition, outcome learning, recommendation refinement"
    canonical_owner: "app/learning_intelligence/"
    canonical_function: "LearningIntelligenceEngine, get_learning_intelligence()"
    production_backend: "In-memory / SQLAlchemy"
    status: "production"

  execution:
    description: "Execution gate, effects, and runtime"
    canonical_owner: "app/runtime/entry.py"
    canonical_function: "process_event()"
    production_backend: "SQLAlchemy"
    status: "production"

  learning:
    description: "Basic learning from outcomes, confidence adjustment"
    canonical_owner: "app/intelligence/learning.py"
    canonical_function: "record_outcome(), adjust_confidence()"
    production_backend: "In-memory / SQLAlchemy"
    status: "production"

  conversations:
    description: "Communication threads and message proposals"
    canonical_owner: "app/communication/models.py"
    canonical_function: "MessageProposal"
    production_backend: "SQLAlchemy"
    status: "production"

  documents:
    description: "Document storage and processing"
    canonical_owner: "app/document/models.py"
    canonical_function: "Document model"
    production_backend: "SQLAlchemy"
    status: "production"

  integrations:
    description: "External system integrations (Gmail, WhatsApp, etc.)"
    canonical_owner: "app/integration/gmail_ingest.py"
    canonical_function: "ingest_emails(), email_to_object()"
    production_backend: "Gmail API / SQLAlchemy"
    status: "production"

  gmail_extraction:
    description: "Robust MIME body extraction, HTML cleaning, classification"
    canonical_owner: "backend/integrations/google/gmail_client.py"
    canonical_function: "extract_message_body(), clean_html()"
    production_backend: "Pure Python (no external deps for extraction)"
    status: "transitional — to be consolidated into app/integration/"

  audit:
    description: "Security audit logging and provenance"
    canonical_owner: "app/security/audit.py"

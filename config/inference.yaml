# SHUNYA Inference Orchestrator Configuration
# =============================================================================
# This file defines all providers, models, and routing policies.
# Changes here require no application code changes — restart the service to reload.
# Environment variables still override API keys (e.g., GROQ_API_KEY).
# =============================================================================

providers:
  - id: groq
    name: Groq
    api_base: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    enabled: true
    priority: 10  # highest priority among free providers
    models:
      - id: llama-3.3-70b-versatile
        name: "Llama 3.3 70B"
        context_window: 32768
        max_output: 8192
        quality: 0.75
        cost_per_token: 0.0  # free tier
        capabilities:
          conversation: 0.85
          reasoning: 0.8
          coding: 0.75
          summarization: 0.8
          extraction: 0.7
    quota:
      rpm: 30
      rpd: 14400
      tpm: 15000  # Groq free tier typical limits

  - id: openrouter
    name: OpenRouter
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    enabled: true
    priority: 20  # second priority
    models:
      - id: openai/gpt-4o-mini
        name: "GPT-4o Mini"
        context_window: 128000
        max_output: 16384
        quality: 0.7
        cost_per_token: 0.00000015  # $0.15/M tokens input
        capabilities:
          conversation: 0.8
          reasoning: 0.7
          coding: 0.7
          summarization: 0.8
          extraction: 0.7
      - id: openai/gpt-4o
        name: "GPT-4o"
        context_window: 128000
        max_output: 16384
        quality: 0.9
        cost_per_token: 0.0000025  # $2.50/M tokens input
        capabilities:
          conversation: 0.9
          reasoning: 0.9
          coding: 0.9
          vision: 0.9
          summarization: 0.9
          extraction: 0.85
      - id: openai/gpt-oss-20b
        name: "GPT-OSS-20B"
        context_window: 128000
        max_output: 8192
        quality: 0.65
        cost_per_token: 0.00000003  # $0.03/M tokens input
        capabilities:
          conversation: 0.65
          reasoning: 0.6
          coding: 0.5
          summarization: 0.6
          extraction: 0.55

  - id: local
    name: Local Provider
    api_base: ""
    api_key_env: ""
    enabled: true
    priority: 100  # lowest priority — always last resort
    models:
      - id: local
        name: "Local Fallback"
        context_window: 4096
        max_output: 1024
        quality: 0.2
        cost_per_token: 0.0
        capabilities:
          conversation: 0.3
          reasoning: 0.1
          summarization: 0.2
    quota:
      rpm: 999999
      rpd: 9999999
      tpm: 999999

policies:
  - name: conversation
    description: "Everyday chat — smallest acceptable model, free tier preferred"
    capability: conversation
    min_quality: 0.3
    max_cost: 0.0
    prefer_free: true
    preferred_providers: [groq]
    fallback_providers: [openrouter, local]

  - name: coding
    description: "Code generation — strongest coding model"
    capability: coding
    min_quality: 0.7
    max_cost: 0.0001
    prefer_free: false
    preferred_providers: [groq, openrouter]
    fallback_providers: [openrouter, local]

  - name: reasoning
    description: "Complex analysis — balanced reasoning model"
    capability: reasoning
    min_quality: 0.6
    max_cost: 0.0001
    prefer_free: false
    preferred_providers: [groq, openrouter]
    fallback_providers: [openrouter, local]

  - name: extraction
    description: "Document/structured extraction — cheap extraction-optimized model"
    capability: extraction
    min_quality: 0.4
    max_cost: 0.0
    prefer_free: true
    preferred_providers: [groq]
    fallback_providers: [openrouter, local]

  - name: summarization
    description: "Text summarization — balanced cheap model"
    capability: summarization
    min_quality: 0.4
    max_cost: 0.0
    prefer_free: true
    preferred_providers: [groq]
    fallback_providers: [openrouter, local]

  - name: default
    description: "Fallback — cheapest available"
    min_quality: 0.2
    max_cost: 0.0
    prefer_free: true
    preferred_providers: [groq, openrouter]
    fallback_providers: [local]

# Observation recording configuration
observability:
  dashboard_enabled: true
  telemetry_retention_hours: 168  # 7 days
  health_check_interval_s: 60
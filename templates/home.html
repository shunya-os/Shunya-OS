<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUNYA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-[#faf9f7] text-[#1a1a1a] font-sans antialiased min-h-screen flex flex-col">

<main class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-6 py-16 sm:py-24">

  <!-- Identity mark -->
  <div class="mb-12 sm:mb-16">
    <h1 class="text-lg font-medium tracking-tight text-[#1a1a1a]/60">SHUNYA</h1>
  </div>

  <!-- Thinking surface -->
  <div class="flex-1 flex flex-col">
    <p class="text-sm text-[#1a1a1a]/40 mb-4">What's on your mind?</p>

    <form id="thought-form" class="flex-1 flex flex-col">
      <textarea id="thought-input"
        class="w-full flex-1 min-h-[240px] bg-transparent border-0 resize-none text-xl sm:text-2xl font-light leading-relaxed text-[#1a1a1a] placeholder-[#1a1a1a]/20 focus:outline-none focus:ring-0"
        placeholder="Type anything..."></textarea>

      <div id="response-area" class="mt-6 hidden">
        <div id="response-text" class="text-base leading-relaxed text-[#1a1a1a]/70"></div>
        <div id="identity-prompt" class="mt-8 p-5 bg-white/60 border border-[#1a1a1a]/5 rounded-2xl hidden">
          <p class="text-sm text-[#1a1a1a]/60 leading-relaxed">
            Would you like to create your SHUNYA Identity so we can continue this together?
          </p>
          <div class="flex gap-3 mt-4">
            <a href="/identity/create"
              class="inline-flex items-center px-4 py-2 bg-[#1a1a1a] text-white text-sm font-medium rounded-xl hover:bg-[#1a1a1a]/90 transition-colors">
              Create Identity
            </a>
            <a href="/login"
              class="inline-flex items-center px-4 py-2 border border-[#1a1a1a]/10 text-[#1a1a1a]/60 text-sm font-medium rounded-xl hover:border-[#1a1a1a]/20 hover:text-[#1a1a1a]/80 transition-colors">
              Sign In
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="mt-16 flex items-center justify-between text-xs text-[#1a1a1a]/25">
    <span>&copy; SHUNYA</span>
    <div class="flex gap-4">
      <a href="/identity/create" class="hover:text-[#1a1a1a]/40 transition-colors">Create Identity</a>
      <a href="/login" class="hover:text-[#1a1a1a]/40 transition-colors">Sign In</a>
    </div>
  </footer>

</main>

<script>
  const input = document.getElementById('thought-input');
  const responseArea = document.getElementById('response-area');
  const responseText = document.getElementById('response-text');
  const identityPrompt = document.getElementById('identity-prompt');
  let thoughtCount = 0;

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = this.value.trim();
      if (!text) return;

      thoughtCount++;
      this.value = '';
      responseArea.classList.remove('hidden');
      responseText.textContent = 'I hear you.';

      // Show identity prompt after first meaningful interaction
      if (thoughtCount >= 1) {
        setTimeout(() => {
          identityPrompt.classList.remove('hidden');
          identityPrompt.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 800);
      }
    }
  });

  // Expand textarea naturally
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.max(240, this.scrollHeight) + 'px';
  });
</script>

</body>
</html>

{% extends "auth_base.html" %}
{% block title %}Sign Up | Shunya OS{% endblock %}
{% block content %}
<div class="w-full max-w-sm mx-auto">
  <div class="text-center mb-8">
    <span class="text-4xl block mb-3">🚀</span>
    <h1 class="text-2xl font-bold text-white">Create your account</h1>
    <p class="text-slate-400 text-sm mt-1">Get started with Shunya OS</p>
  </div>

  <div class="auth-card rounded-2xl p-6 auth-glow">
    <form id="signup-form" onsubmit="signup(event)" class="space-y-4">
      <div>
        <label for="s-name" class="block text-sm font-semibold text-slate-700 mb-1.5">Your Name</label>
        <input id="s-name" name="name" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
          placeholder="John Doe">
      </div>
      <div>
        <label for="s-email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
        <input id="s-email" name="email" type="email" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
          placeholder="you@company.com">
      </div>
      <div>
        <label for="s-password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <input id="s-password" name="password" type="password" required minlength="6"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 pr-10 transition-all"
            placeholder="At least 6 characters">
          <button type="button" class="password-toggle" onclick="togglePasswordVis('s-password', this)" aria-label="Toggle password visibility">
            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg class="w-5 h-5 eye-closed" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
          </button>
        </div>
      </div>
      <div>
        <label for="s-company" class="block text-sm font-semibold text-slate-700 mb-1.5">Company Name</label>
        <input id="s-company" name="company_name" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
          placeholder="Your Company">
      </div>
      <div>
        <label for="s-type" class="block text-sm font-semibold text-slate-700 mb-1.5">Business Type</label>
        <select id="s-type" name="business_type"
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
          <option value="travel">Travel & Tourism</option>
          <option value="hospital">Healthcare & Hospitals</option>
          <option value="school">Education & Schools</option>
          <option value="retail">Retail & E-commerce</option>
          <option value="real_estate">Real Estate</option>
          <option value="hospitality">Hospitality</option>
          <option value="freelancer">Freelancer / Consultant</option>
          <option value="other" selected>Other Business</option>
        </select>
      </div>

      <!-- WhatsApp Phone (mandatory) -->
      <div>
        <label for="s-whatsapp" class="block text-sm font-semibold text-slate-700 mb-1.5">📱 WhatsApp Number <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <input id="s-whatsapp" name="whatsapp_phone" type="tel" required
            class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
            placeholder="+91 98765 43210">
          <button type="button" id="verify-wa-btn" onclick="verifyWhatsApp()"
            class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg transition-colors whitespace-nowrap">
            Verify
          </button>
        </div>
        <p id="wa-status" class="text-xs text-slate-400 mt-1"></p>
      </div>

      <!-- OTP field (hidden until verify clicked) -->
      <div id="otp-section" style="display:none">
        <label for="s-otp" class="block text-sm font-semibold text-slate-700 mb-1.5">Enter OTP</label>
        <div class="flex gap-2">
          <input id="s-otp" name="otp" type="text" maxlength="6"
            class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm text-center font-mono text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
            placeholder="_ _ _ _ _ _">
          <button type="button" onclick="verifyOTP()"
            class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors whitespace-nowrap">
            Confirm
          </button>
        </div>
        <p id="otp-status" class="text-xs text-slate-400 mt-1">Check your WhatsApp for the OTP</p>
      </div>

      <!-- Secondary Phone (optional) -->
      <div>
        <label for="s-secondary" class="block text-sm font-semibold text-slate-700 mb-1.5">📞 Emergency / Secondary (optional)</label>
        <input id="s-secondary" name="secondary_phone" type="tel"
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
          placeholder="+91 98765 43210">
      </div>

      <button type="submit" id="signup-submit-btn" disabled
        class="w-full bg-slate-400 text-white text-sm font-medium px-5 py-2.5 rounded-lg cursor-not-allowed flex items-center justify-center transition-colors"
        aria-label="Create your account">
        <span class="btn-text">Verify WhatsApp first</span>
      </button>
    </form>
    <p class="text-center text-xs text-slate-400 mt-4">
      Already have an account? <a href="/auth/login" class="text-indigo-600 hover:text-indigo-700 font-medium hover:underline">Sign in</a>
    </p>
  </div>
</div>

<script>
let waVerified = false;

async function verifyWhatsApp() {
  const phone = document.getElementById('s-whatsapp').value.trim();
  if (!phone) { alert('Please enter your WhatsApp number'); return; }
  const btn = document.getElementById('verify-wa-btn');
  const status = document.getElementById('wa-status');
  btn.disabled = true;
  btn.innerHTML = 'Sending...';
  status.textContent = 'Sending OTP via WhatsApp...';

  try {
    // Send OTP via API
    const r = await fetch('/signup/otp/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone})
    });
    const d = await r.json();
    if (!d.success) { throw new Error(d.error); }

    // Open WhatsApp with the OTP via wa.me deep link
    const otp = d.otp;
    const waLink = 'https://wa.me/' + phone.replace(/[^0-9]/g, '') + '?text=Your+Shunya+OS+verification+code+is:+' + otp;
    status.textContent = '✅ OTP sent! Check your WhatsApp.';
    document.getElementById('otp-section').style.display = 'block';

    // Open WhatsApp in a new tab/window
    window.open(waLink, '_blank');

  } catch(e) {
    status.textContent = '❌ ' + (e.message || 'Failed to send OTP');
  }
  btn.disabled = false;
  btn.innerHTML = 'Verify';
}

async function verifyOTP() {
  const otp = document.getElementById('s-otp').value.trim();
  const phone = document.getElementById('s-whatsapp').value.trim();
  if (!otp || otp.length < 4) { alert('Please enter the OTP'); return; }
  const status = document.getElementById('otp-status');

  try {
    const r = await fetch('/signup/otp/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone, otp: otp})
    });
    const d = await r.json();
    if (!d.success) { throw new Error(d.error); }

    waVerified = true;
    status.textContent = '✅ WhatsApp verified!';
    status.className = 'text-xs text-emerald-600 mt-1 font-medium';

    // Enable submit button
    const btn = document.getElementById('signup-submit-btn');
    btn.disabled = false;
    btn.className = 'w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors flex items-center justify-center';
    btn.querySelector('.btn-text').textContent = 'Create Account';

    // Lock the WhatsApp number field
    document.getElementById('s-whatsapp').readOnly = true;

  } catch(e) {
    status.textContent = '❌ ' + (e.message || 'Invalid OTP');
  }
}

async function signup(e) {
  e.preventDefault();
  if (!waVerified) { alert('Please verify your WhatsApp number first'); return; }
  const f = e.target;
  const btn = document.getElementById('signup-submit-btn');
  const btnText = btn.querySelector('.btn-text');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Creating account...';

  const r = await fetch('/signup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: f.name.value,
      email: f.email.value,
      password: f.password.value,
      company_name: f.company_name.value,
      business_type: f.business_type.value,
      whatsapp_phone: f.whatsapp_phone.value,
      secondary_phone: f.secondary_phone.value
    })
  });
  const d = await r.json();
  if (d.success) window.location.href = d.redirect;
  else { alert(d.error); btn.disabled = false; btnText.innerHTML = 'Create Account'; }
}

function togglePasswordVis(inputId, btn) {
  const input = document.getElementById(inputId);
  const openEye = btn.querySelector('.eye-open');
  const closedEye = btn.querySelector('.eye-closed');
  if (input.type === 'password') {
    input.type = 'text';
    openEye.style.display = 'none';
    closedEye.style.display = 'block';
  } else {
    input.type = 'password';
    openEye.style.display = 'block';
    closedEye.style.display = 'none';
  }
}
</script>
{% endblock %}

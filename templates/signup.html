{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-8 sm:py-12 px-3 sm:px-4">
  <div class="w-full max-w-md mx-auto">
    <div class="text-center mb-6 sm:mb-8">
      <span class="text-4xl">🚀</span>
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-2">Create your account</h1>
      <p class="text-slate-500 text-sm mt-1">Get started with Shunya OS</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 sm:p-6">
      <form id="signup-form" onsubmit="signup(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Your Name</label>
          <input name="name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
          <input name="email" type="email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
          <input name="password" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Company Name</label>
          <input name="company_name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Business Type</label>
          <select name="business_type" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="travel">Travel & Tourism</option>
            <option value="hospital">Healthcare & Hospitals</option>
            <option value="school">Education & Schools</option>
            <option value="retail">Retail & E-commerce</option>
            <option value="real_estate">Real Estate</option>
            <option value="hospitality">Hospitality</option>
            <option value="freelancer">Freelancer / Consultant</option>
            <option value="other" selected>Other Business</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-blue-700 transition-colors">Create Account</button>
      </form>
      <p class="text-center text-xs text-slate-400 mt-4">
        Already have an account? <a href="/auth/login" class="text-blue-600 hover:underline">Sign in</a>
      </p>
    </div>
  </div>
</div>
<script>
async function signup(e) {
  e.preventDefault(); const f = e.target;
  const r = await fetch('/auth/signup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name: f.name.value, email: f.email.value, password: f.password.value, company_name: f.company_name.value, business_type: f.business_type.value})});
  const d = await r.json();
  if (d.success) window.location.href = d.redirect; else alert(d.error);
}
</script>
{% endblock %}

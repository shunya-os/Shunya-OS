<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white font-sans min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm mx-auto px-4 text-center">
    <span class="text-4xl block mb-2">🔐</span>
    <h1 class="text-xl font-bold mb-1">Client Portal</h1>
    <p class="text-sm text-white/40 mb-6">Enter your phone to receive a login code</p>
    <form onsubmit="sendOtp(event)" class="space-y-4">
      <input id="phone" type="tel" placeholder="+91 98765 43210" required
        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-white/40 text-sm focus:outline-none focus:border-white/30">
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-colors text-sm">Send OTP</button>
    </form>
    <form onsubmit="verifyOtp(event)" class="space-y-4 mt-4 hidden" id="otp-form">
      <p class="text-sm text-white/60">Enter the OTP sent to your phone</p>
      <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" required
        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-white/40 text-sm text-center text-2xl tracking-widest focus:outline-none focus:border-white/30">
      <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-medium rounded-xl transition-colors text-sm">Verify</button>
    </form>
    <p class="text-xs text-white/20 mt-8">Powered by Shunya OS</p>
  </div>
  <script>
  let phone = '';
  async function sendOtp(e) {
    e.preventDefault();
    phone = document.getElementById('phone').value;
    const r = await fetch('/client/api/send-otp', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone})});
    const d = await r.json();
    if (d.success) { document.querySelector('form:first-of-type').classList.add('hidden'); document.getElementById('otp-form').classList.remove('hidden'); }
    else alert(d.error);
  }
  async function verifyOtp(e) {
    e.preventDefault();
    const otp = document.getElementById('otp').value;
    const code = new URLSearchParams(window.location.search).get('code') || '';
    const r = await fetch('/client/api/verify-otp', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone, otp, code})});
    const d = await r.json();
    if (d.redirect) window.location.href = d.redirect;
    else alert(d.error);
  }
  </script>
</body>
</html>

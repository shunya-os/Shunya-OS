{% extends "client/client_base.html" %}
{% block title %}Register — Panchi Club Client Portal{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 fade-in">
      <!-- Brand -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg mx-auto mb-4">
          P
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
        <p class="text-gray-500 text-sm mt-1">Join Panchi Club to manage your trip</p>
      </div>

      <!-- Registration Form -->
      <form method="post" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
          <input type="text" id="name" name="name" required
            class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all placeholder:text-gray-400"
            placeholder="Your full name">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all placeholder:text-gray-400"
            placeholder="you@example.com">
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number</label>
          <input type="tel" id="phone" name="phone"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all placeholder:text-gray-400"
            placeholder="+91 98765 43210">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required minlength="6"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all placeholder:text-gray-400"
            placeholder="At least 6 characters">
        </div>
        <div>
          <label for="lead_code" class="block text-sm font-medium text-gray-700 mb-1.5">
            Lead Code <span class="text-gray-400 font-normal">(optional — provided by your travel team)</span>
          </label>
          <input type="text" id="lead_code" name="lead_code"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all placeholder:text-gray-400 uppercase"
            placeholder="e.g. PC10072601">
        </div>

        <button type="submit"
          class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-semibold rounded-xl hover:from-amber-600 hover:to-orange-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-all shadow-md hover:shadow-lg">
          Create Account
        </button>
      </form>

      <!-- Login link -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="{{ url_for('client.client_login') }}" class="font-semibold text-amber-600 hover:text-amber-700 transition-colors">Sign in</a>
      </p>
    </div>

    <p class="text-center mt-6">
      <a href="/" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">← Back to Team Portal</a>
    </p>
  </div>
</div>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>{% block title %}Shunya OS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
        }
      }
    }
  </script>
  <style>
    .auth-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
    }
    .auth-glow {
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.1);
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .password-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; padding: 4px;
      color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
    }
    .password-toggle:hover { color: #475569; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  {% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">🧠 Learning Engine</h1>
      <p class="text-sm text-slate-500 mt-1">Patterns detected from your business data</p>
    </div>
    <button onclick="runScan()" class="inline-flex items-center gap-1.5 bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl hover:bg-blue-700">
      🔍 Scan Now
    </button>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <p class="text-xs text-slate-400">Proposed</p>
      <p class="text-2xl font-bold text-slate-900" id="count-proposed">0</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <p class="text-xs text-slate-400">Approved</p>
      <p class="text-2xl font-bold text-green-600" id="count-approved">0</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <p class="text-xs text-slate-400">Rejected</p>
      <p class="text-2xl font-bold text-red-600" id="count-rejected">0</p>
    </div>
  </div>

  <!-- Proposals List -->
  <div id="proposals-list" class="space-y-3">
    <div class="text-center text-sm text-slate-400 py-12">Scan your business data to discover patterns</div>
  </div>

  <!-- Scan result indicator -->
  <div id="scan-result" class="hidden fixed bottom-24 right-80 bg-green-500 text-white text-xs px-3 py-1.5 rounded-full shadow-lg">✅ Scan complete</div>
</div>

<script>
async function loadProposals() {
  const r = await fetch('/api/learning/proposals');
  const d = await r.json();
  const list = document.getElementById('proposals-list');
  const proposals = d.proposals || [];
  
  document.getElementById('count-proposed').textContent = proposals.filter(p => p.status === 'proposed').length;
  document.getElementById('count-approved').textContent = proposals.filter(p => p.status === 'approved').length;
  document.getElementById('count-rejected').textContent = proposals.filter(p => p.status === 'rejected').length;

  if (!proposals.length) {
    list.innerHTML = '<div class="text-center text-sm text-slate-400 py-12">No patterns detected yet. Click "Scan Now" to analyze your business data.</div>';
    return;
  }

  list.innerHTML = proposals.map(p => `
    <div class="bg-white border border-slate-200 rounded-xl p-4 hover:shadow-sm transition-shadow">
      <div class="flex items-start gap-3">
        <span class="text-lg mt-1">${p.icon || '🧠'}</span>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-semibold text-slate-800 text-sm">${p.title}</p>
              <p class="text-sm text-slate-500 mt-0.5">${p.description}</p>
              ${p.recommendation ? `<p class="text-xs text-blue-600 mt-1">💡 ${p.recommendation}</p>` : ''}
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap
              ${p.status === 'approved' ? 'bg-green-50 text-green-600' : 
                p.status === 'rejected' ? 'bg-red-50 text-red-600' : 
                'bg-amber-50 text-amber-600'}">${p.status}</span>
          </div>
          <div class="flex items-center gap-3 mt-2 text-xs text-slate-400">
            <span>🧪 ${p.evidence_count} evidence</span>
            <span>📊 ${Math.round(p.confidence * 100)}% confidence</span>
            <span>🏷️ ${p.type}</span>
          </div>
          ${p.status === 'proposed' ? `
          <div class="flex gap-2 mt-3">
            <button onclick="reviewProposal(${p.id}, 'approve')" class="px-3 py-1.5 bg-green-50 text-green-700 text-xs font-medium rounded-lg hover:bg-green-100">✅ Approve</button>
            <button onclick="reviewProposal(${p.id}, 'reject')" class="px-3 py-1.5 bg-red-50 text-red-700 text-xs font-medium rounded-lg hover:bg-red-100">❌ Reject</button>
            <button onclick="reviewProposal(${p.id}, 'request_more')" class="px-3 py-1.5 bg-amber-50 text-amber-700 text-xs font-medium rounded-lg hover:bg-amber-100">📋 Need More</button>
          </div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

async function runScan() {
  const btn = document.querySelector('[onclick="runScan()"]');
  btn.textContent = '⏳ Scanning...'; btn.disabled = true;
  const r = await fetch('/api/learning/scan', {method: 'POST'});
  const d = await r.json();
  const el = document.getElementById('scan-result');
  el.classList.remove('hidden');
  el.textContent = `✅ Scan complete: ${d.patterns_found} patterns, ${d.proposals_created} proposals`;
  setTimeout(() => el.classList.add('hidden'), 4000);
  btn.textContent = '🔍 Scan Now'; btn.disabled = false;
  loadProposals();
}

async function reviewProposal(id, decision) {
  await fetch('/api/learning/review', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({proposal_id: id, decision})
  });
  loadProposals();
}

loadProposals();
</script>
{% endblock %}

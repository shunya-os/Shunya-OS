{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-bold text-white">📋 Capability Catalog</h1>
  <div class="flex items-center gap-2">
    <span id="cap-count" class="text-sm text-slate-400"></span>
  </div>
</div>

<!-- Summary Stats -->
<div id="stats-row" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mb-6"></div>

<!-- Filters -->
<div class="flex flex-wrap gap-2 mb-4">
  <button class="filter-btn active" data-filter="all" onclick="filterCaps('all')">All</button>
  <button class="filter-btn" data-filter="completed" onclick="filterCaps('completed')">✅ Completed</button>
  <button class="filter-btn" data-filter="in-progress" onclick="filterCaps('in-progress')">🔄 In Progress</button>
  <button class="filter-btn" data-filter="planned" onclick="filterCaps('planned')">📋 Planned</button>
  <button class="filter-btn" data-filter="deprecated" onclick="filterCaps('deprecated')">⚠️ Deprecated</button>
</div>

<!-- Legend -->
<div class="flex flex-wrap gap-4 text-xs text-slate-500 mb-3">
  <span><span class="cap-badge cap-planned">📋 planned</span> Not started</span>
  <span><span class="cap-badge cap-in-progress">🔄 in-progress</span> Actively developed</span>
  <span><span class="cap-badge cap-completed">✅ completed</span> Shipped</span>
  <span><span class="cap-badge cap-deprecated">⚠️ deprecated</span> No longer active</span>
</div>

<!-- Catalog Table -->
<div class="cap-card p-5 overflow-x-auto" id="catalog-card">
  <div class="cap-row font-semibold text-xs uppercase tracking-wider text-slate-500 pb-3">
    <div>ID</div>
    <div>Capability</div>
    <div class="col-status">Status</div>
    <div class="col-progress">Progress</div>
    <div class="col-deps">Dependencies</div>
  </div>
  <div id="cap-list"></div>
</div>

<script>
// Predefined categories for grouping
const GROUP_ORDER = ['SYS', 'AI', 'COM', 'BIZ', 'ADM', 'PLT'];
const GROUP_LABELS = {
  SYS: '🏗️ Foundation & Core',
  AI: '🧠 Intelligence & Agents',
  COM: '📡 Communication',
  BIZ: '💼 Business Applications',
  ADM: '🛠️ Admin & Infrastructure',
  PLT: '⚙️ Platform & DevOps',
};

let allCaps = [];
let currentFilter = 'all';

async function loadCapabilities() {
  try {
    const res = await fetch('/admin/api/capabilities');
    const data = await res.json();
    allCaps = data.capabilities || [];
    const summary = data.summary || {};
    renderStats(summary, data.count);
    renderCatalog(allCaps);
  } catch (e) {
    document.getElementById('cap-list').innerHTML =
      `<div class="text-center py-8 text-slate-500">Failed to load capabilities: ${e.message}</div>`;
  }
}

function renderStats(summary, total) {
  const row = document.getElementById('stats-row');
  const stats = [
    { label: 'Total', value: total || 0, color: 'from-blue-500 to-blue-700', icon: '📋' },
    { label: 'Completed', value: summary.completed || 0, color: 'from-emerald-500 to-emerald-700', icon: '✅' },
    { label: 'In Progress', value: summary['in-progress'] || 0, color: 'from-amber-500 to-amber-700', icon: '🔄' },
    { label: 'Planned', value: summary.planned || 0, color: 'from-slate-500 to-slate-700', icon: '📌' },
  ];
  row.innerHTML = stats.map(s => `
    <div class="stat-card cap-card bg-gradient-to-br ${s.color}">
      <div class="text-2xl mb-1">${s.icon}</div>
      <div class="text-2xl font-bold text-white">${s.value}</div>
      <div class="text-xs text-white/70">${s.label}</div>
    </div>
  `).join('');
  document.getElementById('cap-count').textContent = `${total} capabilities`;
}

function renderCatalog(caps) {
  const container = document.getElementById('cap-list');
  const filtered = currentFilter === 'all' ? caps : caps.filter(c => c.status === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="text-center py-8 text-slate-500">No capabilities match this filter.</div>`;
    return;
  }

  // Group by prefix
  const groups = {};
  for (const c of filtered) {
    const prefix = c.id.split('-')[0];
    if (!groups[prefix]) groups[prefix] = [];
    groups[prefix].push(c);
  }

  let html = '';
  for (const prefix of GROUP_ORDER) {
    const items = groups[prefix];
    if (!items) continue;
    const label = GROUP_LABELS[prefix] || `🔹 ${prefix}`;
    html += `<div class="group-header">${label} (${items.length})</div>`;
    for (const c of items) {
      const statusClass = `cap-${c.status}`;
      const statusIcon = c.status === 'completed' ? '✅' : c.status === 'in-progress' ? '🔄' : c.status === 'deprecated' ? '⚠️' : '📋';
      const deps = c.depends_on && c.depends_on.length
        ? c.depends_on.map(d => `<span class="text-xs text-slate-400">${d}</span>`).join(', ')
        : '<span class="text-xs text-slate-600">—</span>';
      const pClass = `progress-${c.progress}`;
      const barColor = c.status === 'completed' ? '#10b981'
        : c.status === 'in-progress' ? '#3b82f6'
        : c.status === 'deprecated' ? '#ef4444'
        : '#475569';
      html += `
        <div class="cap-row cap-item" data-status="${c.status}">
          <div class="text-xs font-mono text-slate-400">${c.id}</div>
          <div class="text-sm font-medium text-slate-200">${c.name}</div>
          <div class="col-status"><span class="cap-badge ${statusClass}">${statusIcon} ${c.status}</span></div>
          <div class="col-progress flex items-center gap-2">
            <div class="progress-track flex-1" style="max-width:80px">
              <div class="progress-fill ${pClass}" style="background:${barColor}"></div>
            </div>
            <span class="text-xs font-mono text-slate-400">${c.progress}%</span>
          </div>
          <div class="col-deps dep-line">${deps}</div>
        </div>`;
    }
  }
  container.innerHTML = html;
}

function filterCaps(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === status);
  });
  renderCatalog(allCaps);
}

loadCapabilities();
</script>
{% endblock %}

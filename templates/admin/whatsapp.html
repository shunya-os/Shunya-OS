{% extends "base.html" %}
{% block content %}
<style>
  body { background: #0f172a; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
  .input-dark { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 10px; padding: 10px 14px; width: 100%; }
  .input-dark:focus { outline: none; border-color: #3b82f6; }
</style>

<div class="max-w-3xl mx-auto px-4 py-6">
  <div class="flex items-center gap-3 mb-6">
    <span class="text-2xl">💬</span>
    <div>
      <h1 class="text-lg font-bold text-white">WhatsApp Integration</h1>
      <p class="text-sm text-slate-400">Receive leads and queries directly from WhatsApp</p>
    </div>
  </div>

  <div class="card p-5 mb-4">
    <h3 class="text-sm font-semibold text-white mb-3">WhatsApp Business API</h3>
    <div class="space-y-3 max-w-md">
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wider">Access Token</label>
        <input id="wa-token" class="input-dark mt-1" type="password" placeholder="Paste your WhatsApp API token" value="{{ config.get('whatsapp_token', '') }}">
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wider">Phone Number ID</label>
        <input id="wa-phone" class="input-dark mt-1" placeholder="e.g. 123456789012345" value="{{ config.get('whatsapp_phone_id', '') }}">
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wider">Webhook Verify Token</label>
        <input id="wa-verify" class="input-dark mt-1" placeholder="Set a verification token" value="{{ config.get('whatsapp_verify_token', '') }}">
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wider">Auto-reply (when lead comes in)</label>
        <textarea id="wa-autoreply" class="input-dark mt-1" rows="3" placeholder="{{ 'Hi! Thanks for reaching out. We\'ll get back to you shortly.' }}">{{ config.get('whatsapp_auto_reply', '') }}</textarea>
      </div>
      <button onclick="saveWhatsApp()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors">Save Settings</button>
    </div>
  </div>

  <div class="card p-5 mb-4">
    <h3 class="text-sm font-semibold text-white mb-3">Recent Messages</h3>
    <div id="msg-list" class="space-y-2">
      <div class="text-center text-slate-500 py-4 text-sm">Loading...</div>
    </div>
  </div>

  <div class="card p-5">
    <h3 class="text-sm font-semibold text-white mb-2">Webhook URL</h3>
    <p class="text-xs text-slate-400 mb-2">Configure this URL in your Meta/WhatsApp Business Dashboard:</p>
    <code class="block p-3 bg-slate-900 rounded-xl text-sm text-blue-300 break-all" id="webhook-url">Loading...</code>
  </div>
</div>

<script>
async function load() {
  document.getElementById('webhook-url').textContent = window.location.origin + '/whatsapp/webhook';
  const r = await fetch('/admin/api/whatsapp');
  if (!r.ok) return;
  const d = await r.json();
  if (d.token) document.getElementById('wa-token').value = d.token;
  if (d.phone_id) document.getElementById('wa-phone').value = d.phone_id;
  if (d.verify_token) document.getElementById('wa-verify').value = d.verify_token;
  if (d.auto_reply) document.getElementById('wa-autoreply').value = d.auto_reply;
}

async function saveWhatsApp() {
  const r = await fetch('/admin/api/whatsapp', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      whatsapp_token: document.getElementById('wa-token').value,
      whatsapp_phone_id: document.getElementById('wa-phone').value,
      whatsapp_verify_token: document.getElementById('wa-verify').value,
      whatsapp_auto_reply: document.getElementById('wa-autoreply').value,
    }),
  });
  const d = await r.json();
  alert(d.success ? 'WhatsApp settings saved' : 'Error: ' + (d.error || 'unknown'));
}

load();
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<style>
  body { background: #0f172a; }
  .br-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  .br-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 6px; }
  .br-input { width: 100%; padding: 10px 14px; background: rgba(51,65,85,0.5); border: 1px solid #334155; border-radius: 10px; color: #e2e8f0; font-size: 0.875rem; outline: none; transition: border-color .2s; }
  .br-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .br-input::placeholder { color: #64748b; }
  .br-btn { padding: 10px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; border: none; cursor: pointer; transition: all .2s; }
  .br-btn-primary { background: #3b82f6; color: white; }
  .br-btn-primary:hover { background: #2563eb; }
  .br-btn-success { background: #10b981; color: white; }
  .br-btn-success:hover { background: #059669; }
  .br-btn-danger { background: #ef4444; color: white; }
  .br-btn-danger:hover { background: #dc2626; }
  .notif-row { background: rgba(51,65,85,0.3); border: 1px solid #334155; border-radius: 12px; padding: 16px; transition: all .2s; }
  .notif-row:hover { border-color: #475569; }
  .toast { position: fixed; top: 80px; right: 24px; padding: 12px 20px; border-radius: 12px; font-size: 0.875rem; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: opacity .3s; }
</style>

<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-bold text-white">📧 Email & Notifications</h1>
  <div class="flex gap-2">
    <button onclick="saveAll()" class="br-btn br-btn-primary">💾 Save All</button>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- SMTP Settings -->
  <div class="br-card p-5">
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">🔌 SMTP Settings</h3>
    <div class="space-y-4">
      <div>
        <label class="br-label">SMTP Host</label>
        <input id="smtp-host" class="br-input" placeholder="smtp.gmail.com" value="{{ smtp_config.host if smtp_config else '' }}">
      </div>
      <div>
        <label class="br-label">Port</label>
        <input id="smtp-port" type="number" class="br-input" placeholder="587" value="{{ smtp_config.port if smtp_config else 587 }}">
      </div>
      <div>
        <label class="br-label">Username</label>
        <input id="smtp-user" class="br-input" placeholder="user@gmail.com" value="{{ smtp_config.user if smtp_config else '' }}">
      </div>
      <div>
        <label class="br-label">Password</label>
        <input id="smtp-password" type="password" class="br-input" placeholder="••••••••" value="{{ smtp_config.password if smtp_config else '' }}">
      </div>
      <div>
        <label class="br-label">From Email</label>
        <input id="smtp-from" class="br-input" placeholder="noreply@yourcompany.com" value="{{ smtp_config.from_email if smtp_config else '' }}">
      </div>
    </div>
  </div>

  <!-- Test Email & Notification Triggers -->
  <div class="space-y-6">

    <!-- Test Email -->
    <div class="br-card p-5">
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">🧪 Test Email</h3>
      <div class="flex gap-3">
        <input id="test-to" class="br-input flex-1" placeholder="recipient@example.com">
        <button onclick="sendTest()" class="br-btn br-btn-success whitespace-nowrap">Send Test</button>
      </div>
      <div id="test-result" class="mt-3 text-sm hidden"></div>
    </div>

    <!-- Notification Triggers -->
    <div class="br-card p-5">
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">🔔 Notification Triggers</h3>
      <p class="text-xs text-slate-500 mb-4">When these events happen, emails are sent to the listed addresses (comma-separated).</p>
      <div class="space-y-3" id="notif-list">
        <!-- Lead Created -->
        <div class="notif-row">
          <div class="flex items-center gap-3 mb-2">
            <input type="checkbox" id="trigger-lead" class="w-4 h-4 rounded border-slate-600 bg-slate-700 accent-blue-500 cursor-pointer" onchange="toggleNotifRow('lead')">
            <label for="trigger-lead" class="text-sm font-medium text-white cursor-pointer">📋 Lead Created</label>
          </div>
          <input id="emails-lead" class="br-input text-xs" placeholder="admin@example.com, sales@example.com" disabled>
        </div>
        <!-- Booking Confirmed -->
        <div class="notif-row">
          <div class="flex items-center gap-3 mb-2">
            <input type="checkbox" id="trigger-booking" class="w-4 h-4 rounded border-slate-600 bg-slate-700 accent-blue-500 cursor-pointer" onchange="toggleNotifRow('booking')">
            <label for="trigger-booking" class="text-sm font-medium text-white cursor-pointer">✅ Booking Confirmed</label>
          </div>
          <input id="emails-booking" class="br-input text-xs" placeholder="ops@example.com, team@example.com" disabled>
        </div>
        <!-- Invoice Paid -->
        <div class="notif-row">
          <div class="flex items-center gap-3 mb-2">
            <input type="checkbox" id="trigger-invoice" class="w-4 h-4 rounded border-slate-600 bg-slate-700 accent-blue-500 cursor-pointer" onchange="toggleNotifRow('invoice')">
            <label for="trigger-invoice" class="text-sm font-medium text-white cursor-pointer">💰 Invoice Paid</label>
          </div>
          <input id="emails-invoice" class="br-input text-xs" placeholder="finance@example.com" disabled>
        </div>
        <!-- Ticket Assigned -->
        <div class="notif-row">
          <div class="flex items-center gap-3 mb-2">
            <input type="checkbox" id="trigger-ticket" class="w-4 h-4 rounded border-slate-600 bg-slate-700 accent-blue-500 cursor-pointer" onchange="toggleNotifRow('ticket')">
            <label for="trigger-ticket" class="text-sm font-medium text-white cursor-pointer">🎫 Ticket Assigned</label>
          </div>
          <input id="emails-ticket" class="br-input text-xs" placeholder="support@example.com" disabled>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── Load current config ──
let currentConfig = { smtp: {}, notifications: {} };

async function loadConfig() {
  try {
    const r = await fetch('/admin/api/email');
    const d = await r.json();
    currentConfig = d;

    // SMTP fields
    document.getElementById('smtp-host').value = d.smtp.host || '';
    document.getElementById('smtp-port').value = d.smtp.port || 587;
    document.getElementById('smtp-user').value = d.smtp.user || '';
    document.getElementById('smtp-password').value = d.smtp.password || '';
    document.getElementById('smtp-from').value = d.smtp.from_email || '';

    // Notification triggers
    const triggerMap = {
      'lead':     { key: 'entity_created_lead', checkbox: 'trigger-lead',     input: 'emails-lead' },
      'booking':  { key: 'booking_confirmed',    checkbox: 'trigger-booking',  input: 'emails-booking' },
      'invoice':  { key: 'invoice_paid',         checkbox: 'trigger-invoice',  input: 'emails-invoice' },
      'ticket':   { key: 'ticket_assigned',      checkbox: 'trigger-ticket',   input: 'emails-ticket' },
    };

    for (const [id, cfg] of Object.entries(triggerMap)) {
      const emails = d.notifications[cfg.key] || [];
      const cb = document.getElementById(cfg.checkbox);
      const inp = document.getElementById(cfg.input);
      cb.checked = emails.length > 0;
      inp.value = emails.join(', ');
      inp.disabled = !cb.checked;
    }
  } catch(e) {
    showToast('❌ Failed to load config', 'error');
  }
}

// ── Toggle notification row ──
function toggleNotifRow(id) {
  const input = document.getElementById('emails-' + id);
  const checkbox = document.getElementById('trigger-' + id);
  input.disabled = !checkbox.checked;
  if (!checkbox.checked) input.value = '';
}

// ── Save all ──
async function saveAll() {
  const smtp = {
    host: document.getElementById('smtp-host').value,
    port: parseInt(document.getElementById('smtp-port').value) || 587,
    user: document.getElementById('smtp-user').value,
    password: document.getElementById('smtp-password').value,
    from_email: document.getElementById('smtp-from').value,
  };

  const triggerMap = {
    entity_created_lead: { checkbox: 'trigger-lead',    input: 'emails-lead' },
    booking_confirmed:   { checkbox: 'trigger-booking', input: 'emails-booking' },
    invoice_paid:        { checkbox: 'trigger-invoice', input: 'emails-invoice' },
    ticket_assigned:     { checkbox: 'trigger-ticket',  input: 'emails-ticket' },
  };

  const notifications = {};
  for (const [key, cfg] of Object.entries(triggerMap)) {
    const cb = document.getElementById(cfg.checkbox);
    const inp = document.getElementById(cfg.input);
    if (cb.checked && inp.value.trim()) {
      notifications[key] = inp.value.split(',').map(e => e.trim()).filter(e => e);
    } else {
      notifications[key] = [];
    }
  }

  try {
    const r = await fetch('/admin/api/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ smtp, notifications }),
    });
    const d = await r.json();
    if (d.success) {
      showToast('✅ ' + d.message, 'success');
      currentConfig.smtp = smtp;
      currentConfig.notifications = notifications;
    } else {
      showToast('❌ ' + (d.error || 'Save failed'), 'error');
    }
  } catch(e) {
    showToast('❌ Network error', 'error');
  }
}

// ── Send test email ──
async function sendTest() {
  const to = document.getElementById('test-to').value.trim();
  if (!to) {
    showToast('⚠️ Enter a recipient email', 'error');
    return;
  }

  const btn = document.querySelector('button[onclick="sendTest()"]');
  btn.textContent = '⏳ Sending...';
  btn.disabled = true;

  try {
    const r = await fetch('/admin/api/email/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to }),
    });
    const d = await r.json();
    if (d.success) {
      showToast('✅ ' + d.message, 'success');
    } else {
      showToast('❌ ' + (d.error || 'Failed'), 'error');
    }
  } catch(e) {
    showToast('❌ Network error', 'error');
  }

  btn.textContent = 'Send Test';
  btn.disabled = false;
}

// ── Toast helper ──
function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast';
  if (type === 'error') t.style.background = '#ef4444';
  else t.style.background = '#10b981';
  t.style.color = 'white';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

// ── Load on page ready ──
loadConfig();
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2>{% if editing %}Edit Lead{% else %}New Lead{% endif %}</h2>
<div class="card">
  <form method="post">
    <label>Code <input name="code" value="{{ lead.code if editing else code }}" readonly /></label>
    <label>Source
      <select name="source">
        <option value="telegram" {% if editing and lead.source=='telegram' %}selected{% endif %}>Telegram</option>
        <option value="manual" {% if editing and lead.source=='manual' %}selected{% endif %}>Manual</option>
        <option value="api" {% if editing and lead.source=='api' %}selected{% endif %}>API</option>
        <option value="email" {% if editing and lead.source=='email' %}selected{% endif %}>Email</option>
      </select>
    </label>
    <label>Customer Name <input name="customer_name" value="{{ lead.customer_name or '' }}" required /></label>
    <label>Phone <input name="phone" value="{{ lead.phone or '' }}" /></label>
    <label>Email <input name="email" type="email" value="{{ lead.email or '' }}" /></label>
    <label>Destination <input name="destination" value="{{ lead.destination or '' }}" /></label>
    <label>Pax <input name="pax" value="{{ lead.pax or '' }}" /></label>
    <label>Dates <input name="dates" value="{{ lead.dates or '' }}" /></label>
    <label>Budget (INR) <input name="budget" type="number" step="0.01" min="0" value="{{ lead.budget or '' }}" /></label>
    <label>Assigned To <input name="assigned_to" value="{{ lead.assigned_to or '' }}" /></label>
    <label>Status
      <select name="status">
        <option value="new" {% if (editing and lead.status=='new') or not editing %}selected{% endif %}>New</option>
        <option value="in_progress" {% if editing and lead.status=='in_progress' %}selected{% endif %}>In Progress</option>
        <option value="converted" {% if editing and lead.status=='converted' %}selected{% endif %}>Converted</option>
        <option value="cancelled" {% if editing and lead.status=='cancelled' %}selected{% endif %}>Cancelled</option>
        <option value="on_hold" {% if editing and lead.status=='on_hold' %}selected{% endif %}>On Hold</option>
      </select>
    </label>
    <label>Notes <textarea name="notes" rows="3">{{ lead.notes or '' }}</textarea></label>
    <button type="submit">{% if editing %}Update Lead{% else %}Create Lead{% endif %}</button>
    <a href="{{ url_for('main.leads_list') }}" class="button secondary">Cancel</a>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="min-h-[60vh] flex items-center justify-center" style="background:var(--body-bg,#0f172a)">
  <div class="text-center max-w-lg mx-auto px-4 py-12">
    <div class="text-7xl mb-6 opacity-60">📭</div>
    <h1 class="text-3xl font-bold mb-3" style="color:var(--body-heading,#f8fafc)">Page Not Found</h1>
    <p class="text-base mb-6" style="color:var(--body-muted,#94a3b8)">
      The page you're looking for doesn't exist or has been moved.
      Check the URL or head back to your dashboard.
    </p>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-medium transition-all" 
         style="background:var(--accent,#3b82f6);color:#ffffff;text-decoration:none;"
         onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
        <span>🏠</span> Back to Dashboard
      </a>
      <button onclick="window.history.back()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-medium transition-all"
              style="background:var(--card-bg,#1e293b);color:var(--body-text,#e2e8f0);border:1px solid var(--border,#334155);cursor:pointer;"
              onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        <span>⬅</span> Go Back
      </button>
    </div>
    <div class="mt-10 text-xs" style="color:var(--body-dim,#64748b)">
      Shunya OS — AI-Native Universal Operating System
    </div>
  </div>
</div>

{% endblock %}

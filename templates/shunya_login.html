<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUNYA — Sign in</title>
  <meta name="description" content="Sign in to SHUNYA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23a4865f'/></svg>">
</head>
<body>
  <div class="auth-strip">
    <div class="auth-strip-left">
      <span class="auth-strip-dot" aria-hidden="true"></span>
      <span class="auth-strip-logo">SHUNYA</span>
    </div>
    <div class="auth-strip-nav">
      <a href="/">Home</a>
    </div>
  </div>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue to your workspace.</p>
      <form method="post" action="{{ action|default('/login') }}">
        <div class="auth-field">
          <label class="auth-label" for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus placeholder="you@example.com" class="auth-input">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="Your password" class="auth-input">
        </div>
        {% if error %}
        <div class="auth-error" style="display:block">{{ error }}</div>
        {% endif %}
        <button type="submit" class="auth-btn">Sign in</button>
      </form>
      <div class="auth-link">
        No account? <a href="/identity/create">Create one</a>
      </div>
    </div>
  </main>
</body>
</html>

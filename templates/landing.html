<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SHUNYA — Think clearly. Operate intelligently.</title>
  <meta name="description" content="An operating system for human organizations. Think clearly. Operate intelligently.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23a4865f'/></svg>">
  <style>
    /* =================================================================
       SHUNYA Hero — Phase H Reconstruction
       Directly reproduces the approved canonical visual
       ================================================================= */
    :root {
      --sh-bg: #f9f8f6;
      --sh-surface: #ffffff;
      --sh-text: #1a1c1d;
      --sh-text-soft: rgba(26, 28, 29, 0.5);
      --sh-text-faint: rgba(26, 28, 29, 0.28);
      --sh-gold: #a4865f;
      --sh-border: rgba(26, 28, 29, 0.07);
      --sh-border-hover: rgba(26, 28, 29, 0.14);
      --sh-artwork-bg: #f8f6f2;
      --sh-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--sh-bg);
      color: var(--sh-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Navigation --- */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 52px; padding: 0 32px; position: relative; z-index: 100;
      background: #fefefe;
    }
    .nav-left { display: flex; align-items: center; gap: 10px; }
    .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sh-gold); flex-shrink: 0; }
    .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.03em; color: var(--sh-text); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-link { font-size: 11px; font-weight: 400; color: var(--sh-text-faint); text-decoration: none; letter-spacing: 0.02em; transition: color 0.3s ease; }
    .nav-link:hover { color: var(--sh-text); }
    .nav-link-signin { font-size: 11px; font-weight: 400; color: var(--sh-text-faint); text-decoration: none; letter-spacing: 0.02em; transition: color 0.3s ease; }
    .nav-link-signin:hover { color: var(--sh-text); }

    /* --- Hero Container --- */
    .hero {
      display: flex; align-items: center; gap: 0;
      min-height: calc(100vh - 52px);
      padding: 0 32px;
      max-width: 1200px; margin: 0 auto;
    }

    /* --- Hero Content (left column) --- */
    .hero-content {
      flex: 0 0 auto;
      width: 42%;
      padding-right: 48px;
    }

    .hero-heading {
      font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      font-size: 54px; font-weight: 400; line-height: 1.08; letter-spacing: -0.025em;
      color: var(--sh-text); margin-bottom: 22px;
    }
    .hero-heading-line { display: block; }
    .hero-heading-line:last-child { font-style: italic; }

    .hero-description {
      font-size: 14px; line-height: 1.7;
      color: var(--sh-text-soft); max-width: 380px; margin-bottom: 36px;
    }

    .hero-actions { display: flex; align-items: center; gap: 12px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 22px; border-radius: 10px;
      font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif;
      text-decoration: none; cursor: pointer; border: none; line-height: 1.2;
      transition: all 0.3s var(--sh-ease);
    }
    .btn-primary { background: var(--sh-text); color: var(--sh-surface); }
    .btn-primary:hover { opacity: 0.85; }
    .btn-outline { background: transparent; color: var(--sh-text); border: 1px solid var(--sh-border); padding: 9px 22px; }
    .btn-outline:hover { border-color: var(--sh-border-hover); }
    .btn-arrow { font-size: 14px; line-height: 0; transition: transform 0.3s var(--sh-ease); }
    .btn:hover .btn-arrow { transform: translateX(2px); }

    /* --- Artwork Panel (right column) --- */
    .hero-artwork {
      flex: 1;
      min-width: 0;
      aspect-ratio: 736 / 425;
      background: var(--sh-artwork-bg);
      border-radius: 20px;
      position: relative; overflow: hidden;
    }
    .hero-artwork svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* --- Animation --- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-up { animation: fadeUp 1s var(--sh-ease) forwards; opacity: 0; }
    .animate-fade-in { animation: fadeIn 1.2s var(--sh-ease) forwards; opacity: 0; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.45s; }
    .d4 { animation-delay: 0.6s; }

    /* --- Reduced Motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* --- Responsive --- */
    @media (max-width: 960px) {
      .hero { flex-direction: column; padding: 24px 20px; gap: 32px; }
      .hero-content { width: 100%; padding-right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
      .hero-description { text-align: center; }
      .hero-actions { justify-content: center; }
      .hero-artwork { width: 100%; max-width: 600px; }
      .hero-heading { font-size: 38px; }
    }
    @media (max-width: 600px) {
      .hero { padding: 16px 16px; gap: 24px; }
      .nav { padding: 0 16px; }
      .nav-links { gap: 16px; }
      .hero-heading { font-size: 28px; }
      .hero-description { font-size: 13px; max-width: 100%; }
      .hero-artwork { width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="nav-left">
    <span class="nav-dot" aria-hidden="true"></span>
    <a href="/" class="nav-logo">SHUNYA</a>
  </div>
  <ul class="nav-links" role="menubar">
    <li role="none"><a href="#product" class="nav-link" role="menuitem">Product</a></li>
    <li role="none"><a href="#philosophy" class="nav-link" role="menuitem">Philosophy</a></li>
    <li role="none"><a href="#security" class="nav-link" role="menuitem">Security</a></li>
    <li role="none"><a href="#contact" class="nav-link" role="menuitem">Contact</a></li>
    <li role="none"><a href="/auth/login" class="nav-link-signin" role="menuitem">Sign In</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="hero" aria-label="Hero">
  <div class="hero-content">
    <h1 class="hero-heading animate-fade-up d1">
      <span class="hero-heading-line">Think clearly.</span>
      <span class="hero-heading-line">Operate intelligently.</span>
    </h1>
    <p class="hero-description animate-fade-up d2">
      An operating system for human organizations. SHUNYA helps you understand what matters&mdash;before you ask.
    </p>
    <div class="hero-actions animate-fade-up d3">
      <a href="/identity/create" class="btn btn-primary">
        Get started <span class="btn-arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a href="#product" class="btn btn-outline">Learn more</a>
    </div>
  </div>
  <div class="hero-artwork animate-fade-in d2" role="img" aria-label="SHUNYA artwork: flowing gold ribbons with Devanagari identity mark">
    {% include 'artwork_hero.html' ignore missing %}
  </div>
</section>

</body>
</html>

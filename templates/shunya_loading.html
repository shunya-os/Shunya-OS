<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUNYA — Loading your workspace</title>
  <meta name="description" content="Preparing your workspace">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23a4865f'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--shunya-bg, #fbfaf8);
      color: var(--shunya-text, #1a1c1d);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading {
      text-align: center;
      max-width: 320px;
    }
    .loading-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--shunya-gold, #a4865f);
      margin-bottom: 24px;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .loading h1 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .loading p {
      font-size: 13px;
      color: var(--shunya-text-tertiary, rgba(26,28,29,0.35));
      line-height: 1.5;
    }
    .loading-steps {
      margin-top: 32px;
      text-align: left;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 12px;
      color: var(--shunya-text-tertiary, rgba(26,28,29,0.35));
    }
    .step.active {
      color: var(--shunya-text, #1a1c1d);
    }
    .step.done {
      color: var(--shunya-text-secondary, rgba(26,28,29,0.55));
    }
    .step-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--shunya-text-faint, rgba(26,28,29,0.15));
      flex-shrink: 0;
    }
    .step.active .step-indicator {
      background: var(--shunya-gold, #a4865f);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    .step.done .step-indicator {
      background: var(--shunya-text, #1a1c1d);
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step { animation: fade-up 0.4s ease forwards; opacity: 0; }
    .step:nth-child(1) { animation-delay: 0.2s; }
    .step:nth-child(2) { animation-delay: 0.6s; }
    .step:nth-child(3) { animation-delay: 1.0s; }
    .step:nth-child(4) { animation-delay: 1.4s; }
    .step:nth-child(5) { animation-delay: 1.8s; }
    .step:nth-child(6) { animation-delay: 2.2s; }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loading-dot"></div>
    <h1>Preparing your workspace</h1>
    <p>SHUNYA is setting up your environment. This will only take a moment.</p>
    <div class="loading-steps" id="steps">
      <div class="step" id="step-1">
        <span class="step-indicator"></span>
        <span>Verifying your identity</span>
      </div>
      <div class="step" id="step-2">
        <span class="step-indicator"></span>
        <span>Loading your objects</span>
      </div>
      <div class="step" id="step-3">
        <span class="step-indicator"></span>
        <span>Building your context</span>
      </div>
      <div class="step" id="step-4">
        <span class="step-indicator"></span>
        <span>Connecting intelligence</span>
      </div>
      <div class="step" id="step-5">
        <span class="step-indicator"></span>
        <span>Preparing your workspace</span>
      </div>
      <div class="step" id="step-6">
        <span class="step-indicator"></span>
        <span>Ready</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var steps = [
        document.getElementById('step-1'),
        document.getElementById('step-2'),
        document.getElementById('step-3'),
        document.getElementById('step-4'),
        document.getElementById('step-5'),
        document.getElementById('step-6'),
      ];
      var current = 0;

      function advanceStep() {
        if (current > 0) {
          steps[current - 1].classList.remove('active');
          steps[current - 1].classList.add('done');
        }
        if (current < steps.length) {
          steps[current].classList.add('active');
          current++;
        }
        if (current < steps.length) {
          setTimeout(advanceStep, 800);
        } else {
          // All done — redirect to workspace
          setTimeout(function() {
            window.location.href = '{{ redirect|default("/workspace") }}';
          }, 600);
        }
      }

      setTimeout(advanceStep, 400);
    })();
  </script>
</body>
</html>

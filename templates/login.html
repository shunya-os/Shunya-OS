{% extends "auth_base.html" %}
{% block title %}Sign In | Shunya OS{% endblock %}
{% block content %}
<div class="w-full max-w-sm mx-auto">
  <div class="text-center mb-8">
    <span class="text-4xl block mb-3">🧠</span>
    <h1 class="text-2xl font-bold text-white">Welcome back</h1>
    <p class="text-slate-400 text-sm mt-1">Sign in to your Shunya OS account</p>
  </div>

  <div class="auth-card rounded-2xl p-6 auth-glow">
    <form id="login-form" onsubmit="loginPassword(event)" class="space-y-4">
      <div>
        <label for="login-email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
        <input id="login-email" name="email" type="email" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
          placeholder="you@company.com">
      </div>
      <div>
        <label for="login-password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <input id="login-password" name="password" type="password" required
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 pr-10 transition-all"
            placeholder="••••••••">
          <button type="button" class="password-toggle" onclick="togglePasswordVis('login-password', this)" aria-label="Toggle password visibility">
            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg class="w-5 h-5 eye-closed" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="login-submit-btn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors flex items-center justify-center"
        aria-label="Sign in to your account">
        <span class="btn-text">Sign In</span>
      </button>
    </form>

    <div class="relative my-5">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
      <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-slate-400">or</span></div>
    </div>

    <button onclick="sendMagicLink()"
      class="w-full bg-slate-50 hover:bg-slate-100 text-slate-600 text-sm font-medium px-5 py-2.5 rounded-lg transition-colors"
      aria-label="Send magic login link">
      Send Magic Link
    </button>

    <p class="text-center text-xs text-slate-400 mt-5">
      Don't have an account? <a href="/auth/signup" class="text-indigo-600 hover:text-indigo-700 font-medium hover:underline">Sign up</a>
    </p>
  </div>
</div>

<script>
async function loginPassword(e) {
  e.preventDefault(); const f = e.target;
  const btn = document.getElementById('login-submit-btn');
  const btnText = btn.querySelector('.btn-text');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Signing in...';
  const r = await fetch('/login/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email: f.email.value, password: f.password.value})});
  const d = await r.json();
  if (d.success) window.location.href = d.redirect;
  else { alert(d.error); btn.disabled = false; btnText.innerHTML = 'Sign In'; }
}
async function sendMagicLink() {
  const email = prompt('Enter your email:');
  if (!email) return;
  const r = await fetch('/auth/login/magic-link', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})});
  const d = await r.json();
  alert(d.message || d.error);
}
function togglePasswordVis(inputId, btn) {
  const input = document.getElementById(inputId);
  const openEye = btn.querySelector('.eye-open');
  const closedEye = btn.querySelector('.eye-closed');
  if (input.type === 'password') {
    input.type = 'text';
    openEye.style.display = 'none';
    closedEye.style.display = 'block';
  } else {
    input.type = 'password';
    openEye.style.display = 'block';
    closedEye.style.display = 'none';
  }
}
</script>
{% endblock %}

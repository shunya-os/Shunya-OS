<!--
  SHUNYA OS — Celebrations Widget (_celebrations.html)
  Auto-scanning celebration ticker with confetti-like popup animations.
  Include this before </body> in base_universal.html.
-->
<style>
  .celebration-popup {
    position: fixed;
    bottom: 80px;
    right: 24px;
    z-index: 9999;
    max-width: 380px;
    width: 100%;
    pointer-events: none;
  }
  .celebration-card {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(124,58,237,0.10));
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 20px;
    padding: 18px 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(99,102,241,0.15), 0 0 0 1px rgba(99,102,241,0.08) inset;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    pointer-events: auto;
    animation: celebrationWoosh 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: right center;
    position: relative;
    overflow: hidden;
  }
  .celebration-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: radial-gradient(circle at 100% 0%, rgba(99,102,241,0.12), transparent 60%);
    pointer-events: none;
  }
  .celebration-card.confetti::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 22px;
    background: conic-gradient(
      from 0deg, transparent, rgba(99,102,241,0.06), transparent,
      rgba(236,72,153,0.06), transparent, rgba(52,211,153,0.06), transparent
    );
    animation: confettiSpin 2s linear infinite;
    pointer-events: none;
    mask: radial-gradient(circle at 50% 50%, black 60%, transparent 72%);
    -webkit-mask: radial-gradient(circle at 50% 50%, black 60%, transparent 72%);
  }
  .celebration-card.dismissing {
    animation: celebrationDismiss 0.4s cubic-bezier(0.55, 0, 1, 0.45) forwards;
  }
  .celebration-icon {
    font-size: 2rem;
    line-height: 1;
    flex-shrink: 0;
    animation: celebrationBounce 1s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(99,102,241,0.4));
  }
  .celebration-content { flex: 1; min-width: 0; }
  .celebration-title {
    font-size: 0.9rem; font-weight: 700; color: #e2e8f0;
    margin-bottom: 2px; line-height: 1.3;
  }
  .celebration-message {
    font-size: 0.78rem; color: #94a3b8; line-height: 1.4;
  }
  .celebration-time { font-size: 0.65rem; color: #64748b; margin-top: 4px; }

  .celebration-feed {
    position: fixed;
    bottom: 80px;
    left: 280px;
    z-index: 9998;
    width: 280px;
    max-height: 340px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  @media (max-width: 768px) {
    .celebration-feed { left: 16px; width: calc(100% - 32px); bottom: 70px; }
    .celebration-popup { right: 12px; max-width: calc(100% - 24px); }
  }
  .celebration-feed-item {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 12px;
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
    animation: feedSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: left center;
    transition: all 0.3s ease;
    cursor: default;
  }
  .celebration-feed-item:hover {
    background: rgba(30, 41, 59, 0.95);
    border-color: rgba(99,102,241,0.2);
    transform: translateX(4px);
  }
  .celebration-feed-item .feed-icon { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
  .celebration-feed-item .feed-text { flex: 1; min-width: 0; }
  .celebration-feed-item .feed-title {
    font-size: 0.75rem; font-weight: 600; color: #e2e8f0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .celebration-feed-item .feed-meta { font-size: 0.63rem; color: #64748b; }
  .celebration-feed-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 4px 4px; pointer-events: auto;
  }
  .celebration-feed-header span {
    font-size: 0.7rem; font-weight: 600; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .celebration-feed-header .feed-count {
    background: rgba(99,102,241,0.15); color: #818cf8;
    padding: 1px 8px; border-radius: 10px; font-size: 0.65rem; font-weight: 600;
  }

  @keyframes celebrationWoosh {
    0% { opacity: 0; transform: translateX(60px) scale(0.85); filter: blur(4px); }
    40% { opacity: 1; transform: translateX(-4px) scale(1.02); filter: blur(0); }
    70% { transform: translateX(2px) scale(0.98); }
    100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }
  @keyframes celebrationDismiss {
    0% { opacity: 1; transform: translateX(0) scale(1); }
    100% { opacity: 0; transform: translateX(40px) scale(0.9); filter: blur(3px); }
  }
  @keyframes feedSlideIn {
    0% { opacity: 0; transform: translateX(-20px) scale(0.95); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes celebrationBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @keyframes confettiSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .confetti-particle {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none; animation: confettiFall 1.2s ease-out forwards; opacity: 0;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) rotate(360deg) scale(0); }
  }
  .celebration-glow { animation: glowPulse 2s ease-in-out 1; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
    30% { box-shadow: 0 0 24px 4px rgba(99,102,241,0.2); }
  }
</style>

<div id="celebration-feed" class="celebration-feed">
  <div class="celebration-feed-header">
    <span>🏆 Recent Wins</span>
    <span id="celebration-count-badge" class="feed-count">0</span>
  </div>
  <div id="celebration-feed-items"></div>
</div>

<div id="celebration-popup" class="celebration-popup"></div>

<script>
const CELEBRATION_CONFIG = {
  scanIntervalMs: 30000,
  popupDurationMs: 5000,
  maxFeedItems: 20,
  scanInProgress: false,
};

async function scanCelebrations() {
  if (CELEBRATION_CONFIG.scanInProgress) return;
  CELEBRATION_CONFIG.scanInProgress = true;
  try {
    const resp = await fetch('/api/celebrations/scan');
    if (!resp.ok) return;
    const data = await resp.json();
    const badge = document.getElementById('celebration-count-badge');
    if (badge && data.count !== undefined) badge.textContent = data.count;
    if (data.new && data.new.length > 0) {
      data.new.forEach((c, i) => setTimeout(() => showCelebrationPopup(c), i * 800));
    }
    if (data.celebrations) renderCelebrationFeed(data.celebrations);
  } catch (_) {} finally { CELEBRATION_CONFIG.scanInProgress = false; }
}

function showCelebrationPopup(celeb) {
  const container = document.getElementById('celebration-popup');
  if (!container) return;
  const animType = celeb.animation || 'woosh';
  const card = document.createElement('div');
  card.className = 'celebration-card ' + animType;
  const timeStr = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  card.innerHTML = '<div class="celebration-icon">' + (celeb.icon||'🎉') + '</div>'
    + '<div class="celebration-content">'
    + '<div class="celebration-title">' + esc(celeb.title||'Win!') + '</div>'
    + '<div class="celebration-message">' + esc(celeb.message||'') + '</div>'
    + '<div class="celebration-time">just now · ' + timeStr + '</div></div>';
  if (animType === 'confetti') {
    const colors = ['#6366f1','#ec4899','#34d399','#f59e0b','#8b5cf6','#06b6d4'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-particle';
      p.style.background = colors[i%colors.length];
      p.style.left = (10+Math.random()*80)+'%';
      p.style.top = (10+Math.random()*60)+'%';
      p.style.animationDelay = (Math.random()*0.3)+'s';
      p.style.width = (4+Math.random()*6)+'px';
      p.style.height = p.style.width;
      card.appendChild(p);
    }
  }
  container.innerHTML = '';
  container.appendChild(card);
  setTimeout(() => {
    if (card.parentNode) { card.classList.add('dismissing');
      setTimeout(() => { if(card.parentNode) card.remove(); }, 400); }
  }, CELEBRATION_CONFIG.popupDurationMs);
}

function renderCelebrationFeed(celebrations) {
  const fc = document.getElementById('celebration-feed-items');
  if (!fc) return;
  fc.innerHTML = celebrations.slice(0, CELEBRATION_CONFIG.maxFeedItems).map(c => {
    const t = c.created_at ? new Date(c.created_at+'Z') : new Date();
    const ts = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return '<div class="celebration-feed-item celebration-glow">'
      + '<span class="feed-icon">' + (c.icon||'🎉') + '</span>'
      + '<div class="feed-text"><div class="feed-title">' + esc(c.title||'') + '</div>'
      + '<div class="feed-meta">' + ts + '</div></div></div>';
  }).join('');
}

function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function triggerCelebration(title, message, icon, type) {
  fetch('/api/celebrations', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:title||'Celebration!', message:message||'', icon:icon||'🎉', type:type||'manual'}) })
  .then(r=>r.json()).then(c=>{ if(c&&c.id){ showCelebrationPopup(c); scanCelebrations(); } }).catch(()=>{});
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(scanCelebrations, 1000);
  setInterval(scanCelebrations, CELEBRATION_CONFIG.scanIntervalMs);
  window.triggerCelebration = triggerCelebration;
});
</script>

{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="mb-4">
    <a href="/customers" class="text-sm" style="color:#38bdf8;">← Back to Customers</a>
  </div>

  <div class="c-card p-6">
    <h1 class="text-lg font-bold text-white mb-1">New Customer</h1>
    <p class="text-sm c-muted mb-6">Start a new relationship record.</p>

    <form method="POST">
      <div class="space-y-4">
        <div>
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" required class="form-input" placeholder="e.g. Rajat Nishesh">
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input" placeholder="email@example.com">
        </div>
        <div>
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-input" placeholder="+91-9876543210">
        </div>
        <div>
          <label class="form-label">Preferred Channel</label>
          <select name="preferred_channel" class="form-input">
            <option value="whatsapp">WhatsApp</option>
            <option value="telegram">Telegram</option>
            <option value="email">Email</option>
            <option value="phone">Phone</option>
          </select>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl text-sm font-medium text-white transition-colors" style="background:#0ea5e9;">
          Create Customer
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

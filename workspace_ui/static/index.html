<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUNYA — Universal Workspace</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --secondary: #8b949e; --accent: #58a6ff;
  --danger: #f85149; --success: #3fb950; --warning: #d29922;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

/* Layout */
#app { display: flex; flex-direction: column; height: 100vh; }

/* Top Bar */
.topbar { display: flex; align-items: center; padding: 6px 12px;
          background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px; }
.topbar h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
.topbar .nav-btns { display: flex; gap: 4px; }
.topbar button { background: none; border: 1px solid var(--border); color: var(--text);
                padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.topbar button:hover { background: var(--border); }
.search-box { flex: 1; max-width: 400px; margin: 0 auto; display: flex; gap: 4px; }
.search-box input { flex: 1; background: var(--bg); border: 1px solid var(--border);
                   color: var(--text); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
.search-box input:focus { outline: none; border-color: var(--accent); }
.presence { font-size: 11px; color: var(--secondary); }

/* Main Content */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: var(--surface);
           border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; }
.sidebar h3 { font-size: 11px; text-transform: uppercase; color: var(--secondary);
             letter-spacing: 0.5px; margin: 12px 0 6px 8px; }
.sidebar-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
               border-radius: 4px; cursor: pointer; font-size: 13px; }
.sidebar-item:hover { background: var(--border); }
.sidebar-item .badge { background: var(--danger); color: white; font-size: 10px;
                      padding: 1px 6px; border-radius: 8px; margin-left: auto; }
.sidebar-item .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-danger { background: var(--danger); }
.dot-warning { background: var(--warning); }
.dot-ok { background: var(--success); }

/* Canvas Area */
.canvas { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Signal Bar */
.signal-bar { background: var(--surface); border-bottom: 1px solid var(--border);
             padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; }
.signal-chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px;
              border-radius: 12px; font-size: 12px; white-space: nowrap;
              border: 1px solid var(--border); cursor: pointer; }
.signal-chip:hover { background: var(--border); }
.signal-chip.p0 { border-color: var(--danger); color: var(--danger); }
.signal-chip.p1 { border-color: var(--warning); color: var(--warning); }
.signal-chip.p2 { border-color: var(--accent); color: var(--accent); }

/* Panels */
.panels { flex: 1; display: flex; gap: 1px; background: var(--border); overflow: hidden; }
.panel { flex: 1; background: var(--bg); display: flex; flex-direction: column;
         min-width: 200px; overflow: hidden; }
.panel-header { display: flex; align-items: center; padding: 4px 8px;
               background: var(--surface); font-size: 12px; color: var(--secondary);
               border-bottom: 1px solid var(--border); }
.panel-header .tabs { display: flex; flex: 1; gap: 2px; overflow-x: auto; }
.panel-header .tab { padding: 4px 10px; border-radius: 4px 4px 0 0; font-size: 12px;
                    cursor: pointer; white-space: nowrap; }
.panel-header .tab.active { background: var(--bg); color: var(--text); }
.panel-content { flex: 1; overflow-y: auto; padding: 12px; font-size: 13px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 60px; min-width: 60px; }
  .sidebar-item span { display: none; }
  .sidebar h3 { display: none; }
  .search-box { max-width: 200px; }
}
@media (max-width: 480px) {
  .sidebar { display: none; }
  .panels { flex-direction: column; }
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>⬡ SHUNYA</h1>
    <div class="nav-btns">
      <button onclick="navigateBack()">←</button>
      <button onclick="navigateForward()">→</button>
    </div>
    <div class="search-box">
      <input id="searchInput" placeholder="Search everything..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">🔍</button>
    </div>
    <div class="presence" id="presence"></div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="canvas">
      <div class="signal-bar" id="signalBar"></div>
      <div class="panels" id="panels"></div>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────
const state = { owner: 'default', workspaceId: '', initialized: false, signals: [] };

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  const r = await fetch('/api/init', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({owner_id: state.owner}) });
  const data = await r.json();
  state.workspaceId = data.workspace_id;
  state.initialized = true;
  document.getElementById('presence').textContent = `🟢 ${data.ucps?.available?.length || 0} UCPs`;
  refresh();
}

// ── Refresh ───────────────────────────────────────────────────────────
async function refresh() {
  if (!state.initialized) return;
  const ctx = await (await fetch('/api/context')).json();
  state.signals = ctx.signals || [];
  renderSidebar(ctx.context);
  renderSignals(state.signals);
  renderPanels(state.signals);
}

// ── Render Sidebar ────────────────────────────────────────────────────
function renderSidebar(ctx) {
  const sb = document.getElementById('sidebar');
  const items = [];
  if (ctx?.active_initiatives?.length) items.push({icon:'📋',label:'Initiatives',count:ctx.active_initiatives.length,severity:'warning'});
  if (ctx?.active_agreements?.length) items.push({icon:'📝',label:'Agreements',count:ctx.active_agreements.length,severity:'danger'});
  if (ctx?.active_assets?.length) items.push({icon:'💻',label:'Assets',count:ctx.active_assets.length,severity:'ok'});
  if (ctx?.financial_commitments?.length) items.push({icon:'💰',label:'Financial',count:ctx.financial_commitments.length,severity:'ok'});
  if (ctx?.health_concerns?.length) items.push({icon:'❤️',label:'Health',count:ctx.health_concerns.length,severity:'danger'});
  if (ctx?.learning_paths?.length) items.push({icon:'📚',label:'Learning',count:ctx.learning_paths.length,severity:'ok'});
  if (ctx?.operations_issues?.length) items.push({icon:'⚙️',label:'Operations',count:ctx.operations_issues.length,severity:'warning'});

  sb.innerHTML = '<h3>Living Objects</h3>' +
    items.map(i => `<div class="sidebar-item" onclick="openObject('${i.label}')">
      <span>${i.icon}</span><span>${i.label}</span>
      <span class="badge" style="background:${i.severity==='danger'?'var(--danger)':i.severity==='warning'?'var(--warning)':'var(--success)'}">${i.count}</span>
    </div>`).join('') +
    '<h3>System</h3>' +
    `<div class="sidebar-item" onclick="doSearch()"><span>🔍</span><span>Search</span></div>` +
    `<div class="sidebar-item" onclick="openObject('memory')"><span>🧠</span><span>Memory</span></div>` +
    `<div class="sidebar-item" onclick="openObject('providers')"><span>🔌</span><span>Providers</span></div>`;
}

// ── Render Signals ────────────────────────────────────────────────────
function renderSignals(signals) {
  const bar = document.getElementById('signalBar');
  if (!signals.length) {
    bar.innerHTML = '<div style="color:var(--secondary);font-size:12px;padding:2px 0;">✨ All clear — nothing requires immediate attention</div>';
    return;
  }
  bar.innerHTML = signals.map((s,i) => {
    const pClass = s.priority > 0.8 ? 'p0' : s.priority > 0.6 ? 'p1' : 'p2';
    return `<div class="signal-chip ${pClass}" onclick="openObject('${s.source_ucp}')">
      <span class="dot ${pClass === 'p0' ? 'dot-danger' : pClass === 'p1' ? 'dot-warning' : 'dot-ok'}"></span>
      <span>${s.description}</span>
    </div>`;
  }).join('');
}

// ── Render Panels ─────────────────────────────────────────────────────
function renderPanels(signals) {
  const panelsEl = document.getElementById('panels');
  // Build adaptive panels based on attention signals
  const panelDefs = [];

  // Panel 1: Living Context — always present
  panelDefs.push({title:'Living Context', content: `<div style="color:var(--secondary);font-size:12px;">
    <p>Living Context continuously composes from <strong>${state.signals.length > 0 ? state.signals.map(s=>s.source_ucp).join(', ') : 'all UCPs'}</strong>.</p>
    <p style="margin-top:8px;color:var(--text);">${signals.length} attention signal(s) active.</p>
    <p style="margin-top:4px;">The workspace adapts automatically — no fixed applications or menus.</p>
  </div>`});

  // Panel 2: Attention-driven — shows current priority
  if (signals.length) {
    panelDefs.push({title:'Attention — What Matters Now',
      content: signals.slice(0,3).map(s => `<div style="margin-bottom:8px;padding:8px;background:var(--surface);border-radius:4px;border-left:3px solid ${s.priority>0.8?'var(--danger)':s.priority>0.6?'var(--warning)':'var(--accent)'}">
        <strong style="font-size:13px;">${s.description}</strong>
        <p style="font-size:12px;color:var(--secondary);margin-top:4px;">${s.recommendation}</p>
        <div style="font-size:11px;color:var(--secondary);margin-top:4px;">
          From <strong>${s.source_ucp}</strong> · Priority ${(s.priority*100).toFixed(0)}%
          ${s.requires_action ? '· ⚡ Requires action' : ''}
          ${s.can_automate ? '· 🤖 Can automate' : ''}
          ${s.can_delegate ? '· 👥 Can delegate' : ''}
        </div>
      </div>`).join('')});
  }

  // Panel 3: Memory
  panelDefs.push({title:'Recent Memory',
    content: `<p style="color:var(--secondary);font-size:12px;">Ask me anything or search above. Memory is continuous — not conversation-bound.</p>
    <div id="memoryPreview" style="margin-top:8px;"></div>`});

  panelsEl.innerHTML = panelDefs.map(p => `
    <div class="panel">
      <div class="panel-header">
        <div class="tabs"><span class="tab active">${p.title}</span></div>
      </div>
      <div class="panel-content">${p.content}</div>
    </div>`).join('');
}

// ── Navigation ────────────────────────────────────────────────────────
function openObject(obj) {
  fetch('/api/open', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({workspace_id: state.workspaceId, object_id: obj, label: obj})});
}
function navigateBack() { refresh(); }
function navigateForward() { refresh(); }

// ── Search ────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const data = await r.json();
  const panel = document.querySelector('.panel-content');
  if (!panel) return;
  panel.innerHTML = `<h3 style="margin-bottom:8px;">Search: "${q}"</h3>
    ${data.results?.length ? data.results.map(r => `<div class="sidebar-item" style="border-bottom:1px solid var(--border);">
      <span>${r.type === 'memory' ? '🧠' : '📄'}</span>
      <span>${r.title}</span>
    </div>`).join('') : '<p style="color:var(--secondary);">No results found.</p>'}`;
}

// ── Start ─────────────────────────────────────────────────────────────
init();
// Auto-refresh every 30s
setInterval(refresh, 30000);
</script>
</body>
</html>

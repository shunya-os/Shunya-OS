name: Deploy to Production

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Verify CI certified commit
        run: |
          echo "CI workflow run: ${{ github.event.workflow_run.id }}"
          echo "Certified head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Certified head branch: ${{ github.event.workflow_run.head_branch }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shunya-deploy/shunya_os
            bash infrastructure/scripts/deploy.sh production ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shunya-deploy/shunya_os
            DEPLOYED_SHA=$(curl -fsS http://127.0.0.1:5001/health | python3 -c "import sys,json; print(json.load(sys.stdin)['git_commit'])")
            CERTIFIED_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Certified SHA: ${CERTIFIED_SHA}"
            echo "Deployed SHA: ${DEPLOYED_SHA}"
            if [ "${DEPLOYED_SHA}" != "${CERTIFIED_SHA}" ]; then
              echo "ERROR: Deployed commit does not match CI-certified commit"
              exit 1
            fi
            echo "DEPLOYMENT PROVENANCE VERIFIED"

name: CI-CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Redis is required for realtime/cross-worker delivery certification tests.
    # PostgreSQL on port 5433 is required for test_prod06_process_isolation
    # (dedicated test PG cluster with CREATEDB privilege).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shunya
          POSTGRES_DB: shunya_test_prod06
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shunya -d shunya_test_prod06"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -o pipefail
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Verify all modules compile
        run: |
          set -o pipefail
          python -c "
          import py_compile, glob, sys
          files = glob.glob('core/**/*.py', recursive=True) + glob.glob('governance/verification/*.py', recursive=True)
          errors = 0
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'All {len(files)} files compile OK')
          "
      - name: Run verification tests
        run: |
          set -o pipefail
          PYTHONPATH=$PWD python -m pytest \
            core/relationship_intelligence/verify_ucp02.py \
            core/financial_intelligence/verify_ucp03.py \
            core/financial_intelligence/verify_ucp03a.py \
            core/knowledge_intelligence/verify_ucp04.py \
            core/decision_intelligence/verify_ucp05.py \
            core/agreement_intelligence/verify_ucp06.py \
            core/asset_intelligence/verify_ucp07.py \
            core/initiative_intelligence/verify_ucp08.py \
            core/operations_intelligence/verify_ucp09.py \
            core/health_intelligence/verify_ucp10.py \
            core/learning_intelligence/verify_ucp11.py \
            core/personal_os/verify_ucp12.py \
            governance/verification/verify_stream_c.py \
            governance/verification/verify_stream_d.py \
            governance/verification/verify_stream_e.py \
            governance/verification/verify_stream_f.py \
            governance/verification/verify_stream_g.py \
            governance/verification/verify_stream_h.py \
            -v --tb=short -q
      - name: Verify provider adapters import
        run: |
          set -o pipefail
          PYTHONPATH=$PWD python -c "
          from adapters import DOCUMENT_ADAPTERS, IMAGE_ADAPTERS, INFRA_ADAPTERS
          print(f'Adapters: doc={len(DOCUMENT_ADAPTERS)}, img={len(IMAGE_ADAPTERS)}, infra={len(INFRA_ADAPTERS)}')
          from adapters.document.libreoffice import LibreOfficeAdapter
          from adapters.image.comfyui import ComfyUIAdapter
          from adapters.speech.whisper import WhisperAdapter
          from adapters.search.searxng import SearXNGAdapter
          from adapters.storage.minio import MinIOAdapter
          from adapters.infra.redis import RedisCacheAdapter
          from core.personal_os import PersonalOSOrchestrator
          os = PersonalOSOrchestrator()
          r = os.initialize()
          assert len(r['available']) >= 9
          print(f'Personal OS: {len(r[\"available\"])} UCPs composed')
          print('CI verification passed')
          "
      - name: Run canonical test suite
        env:
          DISABLE_RATE_LIMIT: "1"
          FLASK_ENV: testing
          SHUNYA_AI_PROVIDERS: "local"
          REDIS_URL: "redis://127.0.0.1:6379"
        run: |
          set -o pipefail
          PYTHONPATH=$PWD python -m pytest tests/ -q --tb=short
      - name: Frontend dependency install
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci
      - name: Frontend lint
        working-directory: frontend
        run: |
          set -o pipefail
          # Zero-new-warning governance: baseline stored in .eslint-baseline.json
          node scripts/eslint-governance-check.mjs
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          set -o pipefail
          npx tsc -b --noEmit
      - name: Frontend tests
        working-directory: frontend
        run: |
          set -o pipefail
          npx vitest run
      - name: Frontend production build
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build
      - name: Python dependency security audit
        run: |
          set -o pipefail
          pip install pip-audit
          # pdfkit 1.0.0 (PYSEC-2026-2860) has a known JavaScript execution
          # vulnerability in from_string. It is a pre-existing legacy dependency
          # used only for PDF invoice generation in the legacy CRM module.
          # Accepting the risk; mitigated by not passing untrusted HTML to
          # pdfkit in production paths.
          pip-audit --ignore-vuln PYSEC-2026-2860
      - name: Secret scan — committed .env check
        run: |
          set -o pipefail
          if git ls-files | grep -E '\.env$|\.env\.' | grep -v '\.env\.example'; then
            echo "ERROR: .env file committed to repository"
            exit 1
          fi
          echo "No committed .env secrets"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    # Production deployment is serialized — no cancel-in-progress.
    # A newer push must wait for the current deployment to complete
    # before it can deploy, preventing race conditions and mid-flight
    # cancellation of a production rollout.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Record certified SHA
        run: |
          echo "CI certified SHA: ${{ github.sha }}"
          echo "CI certified branch: ${{ github.ref }}"
          echo "Triggering event: ${{ github.event_name }}"
          echo "CERTIFIED_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shunya-deploy/shunya_os
            bash infrastructure/scripts/deploy.sh production ${{ github.sha }}
          script_stop: true

      - name: Verify local health SHA
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shunya-deploy/shunya_os
            DEPLOYED_SHA=$(curl -fsS http://127.0.0.1:5001/health | python3 -c "import sys,json; print(json.load(sys.stdin)['git_commit'])")
            CERTIFIED_SHA="${{ github.sha }}"
            echo "Certified SHA: ${CERTIFIED_SHA}"
            echo "Deployed (local health) SHA: ${DEPLOYED_SHA}"
            if [ "${DEPLOYED_SHA}" != "${CERTIFIED_SHA}" ]; then
              echo "ERROR: Deployed local commit does not match CI-certified commit"
              exit 1
            fi
            echo "LOCAL HEALTH PROVENANCE: VERIFIED"

      - name: Verify public health SHA
        run: |
          set -o pipefail
          PUBLIC_HEALTH=$(curl -fsS https://shunyaos.com/health 2>/dev/null || echo '{"error":"unreachable"}')
          echo "Public health response: ${PUBLIC_HEALTH}"
          PUBLIC_SHA=$(echo "${PUBLIC_HEALTH}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('git_commit',''))")
          if [ -z "${PUBLIC_SHA}" ]; then
            echo "WARNING: Public health endpoint unreachable or missing git_commit — check DNS/nginx"
            exit 1
          fi
          echo "Public health SHA: ${PUBLIC_SHA}"
          if [ "${PUBLIC_SHA}" != "${{ github.sha }}" ]; then
            echo "ERROR: Public health SHA does not match CI-certified SHA"
            exit 1
          fi
          echo "PUBLIC HEALTH PROVENANCE: VERIFIED"

      - name: Final provenance check
        run: |
          echo "=== RELEASE PROVENANCE ==="
          echo "CI_CERTIFIED_SHA:     ${{ github.sha }}"
          echo "=== DEPLOYMENT VERIFIED ==="
name: Shunya OS CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shunya_test
          POSTGRES_USER: shunya
          POSTGRES_PASSWORD: shunya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest tests/ -v --tb=short --junitxml=test-results.xml
      env:
        SECRET_KEY: ci-test-key
        FLASK_ENV: testing
        DATABASE_URL: postgresql://shunya:shunya_test@localhost:5432/shunya_test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results.xml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /root/shunya_os
          git fetch origin
          git stash
          git checkout master
          git pull origin master
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG" || true
          /usr/local/lib/hermes-agent/venv/bin/python scripts/deploy_migrate.py 2>&1 || { echo "FAIL migration"; git checkout HEAD~1; systemctl restart shunya.service; exit 1; }
          systemctl restart shunya.service
          sleep 3
          systemctl is-active shunya.service || { echo "FAIL service"; git checkout HEAD~1; systemctl restart shunya.service; exit 1; }
          echo "Deployed tag $TAG"
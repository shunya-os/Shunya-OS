# =============================================================================
# Repository Conventions
# =============================================================================
repository_conventions:
  naming_conventions:
    - "Constitutional volumes: CONST-I through CONST-V (Roman numerals)"
    - "Engine IDs: ENG-{3-letter acronym} (e.g., ENG-OBS, ENG-GOV)"
    - "Engine Specs: ES-{001-010} (three-digit numeric)"
    - "Runtimes: RUNTIME-{short name} (e.g., RUNTIME-KRNL, RUNTIME-PIPE)"
    - "ADRs: ADR-{001-007} (three-digit numeric)"
    - "Canons: CANON-{00-12} (two-digit numeric for architecture canons)"
    - "UX Canons: CANON-UX-{01-19} (two-digit numeric)"
    - "DNA docs: DNA-01.{sub-number} (e.g., DNA-01.2, DNA-01.9)"
    - "Architecture docs: ARCH-{short name} (e.g., ARCH-ADAPT, ARCH-GOV)"
    - "Governance docs: GOV-{short name} (e.g., GOV-MODEL, GOV-ENG)"
    - "Phases: PHASE-{A-N} (single letter)"
    - "Git branches: GIT-{branch name} (e.g., GIT-master, GIT-alpha-001a)"
    - "Phase reports: PHASE_{LETTER}_IMPLEMENTATION_REPORT.md or PHASE_{LETTER}_COMPLETION_REPORT.md"
  status_values:
    - "Candidate for Founder Review"
    - "Ratified"
    - "Active"
    - "Draft"
    - "Complete"
    - "Locked"
    - "Superseded"
    - "AUTHORITATIVE"
    - "CANONICAL"
  authority_hierarchy:
    - "CONST-I (First Principles) — Supreme authority"
    - "CONST-II (SHUNYA Constitution) — Derived from CONST-I"
    - "CONST-III (Canonical Definitions) — Derived from CONST-II"
    - "CONST-IV (Constitutional Compliance) — Derived from CONST-I, CONST-II"
    - "CONST-V (Hermes Implementation Charter) — Derived from CONST-I, CONST-II"
    - "Canonical documents (docs/canon/) — Authoritative blueprint"
    - "OS Constitution (docs/canon/OS_CONSTITUTION.md) — OS-level governance"
    - "Governance Model (governance/) — Roles, decisions, approvals"
    - "Engineering Constitution — Engineering principles"
    - "Architecture Governance Framework — Architecture lifecycle"
    - "ADRs — Architecture Decision Records"
    - "Engine Specifications — Detailed design"
    - "Implementation — Code and configuration"
    - "Verification — Proof of conformance"

